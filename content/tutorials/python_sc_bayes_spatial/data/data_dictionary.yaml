# Data dictionary metadata for python_sc_bayes_spatial — drives build_data_dictionary.py.
# Three files: the outcome panel, plus BOTH spatial objects the SAR layer needs.
# The R edition of this post documented only the panel and noted that the weights
# "ship separately inside the scspill package"; this edition republishes them.

study:
  title: "Bayesian Spatial Synthetic Control in Python: California's Proposition 99"
  subtitle: "The Abadie et al. (2010) tobacco panel — 39 US states, 1970–2000 — together with the rook-contiguity weights that let a synthetic control estimate who ELSE was treated."
  overview: >
    Companion data for a Python tutorial that fits three nested synthetic-control estimators to
    California's Proposition&nbsp;99: the classical simplex of Abadie, Diamond &amp; Hainmueller
    (2010), a Bayesian horseshoe prior on unconstrained weights, and the Bayesian spatial (SAR)
    model of Sakaguchi &amp; Tagawa (2026). The outcome panel is the same <strong>real</strong>
    tobacco data used throughout the synthetic-control literature: per-capita cigarette sales
    (<code>cigsale</code>) and real retail price (<code>retprice</code>) for 39 US states over
    1970&ndash;2000, as distributed in the <code>scspill</code> package. California is the one
    treated unit; the other 38 states form the donor pool.
  panel_structure: >
    <strong>Three files.</strong> <code>python_sc_bayes_spatial_source_data.csv</code> is the
    balanced annual state panel &mdash; one row per state &times; year, 39 &times; 31 = 1,209 rows,
    no missing values. 18 pre-treatment years (1970&ndash;1987) and 13 post-treatment years
    (1988&ndash;2000); the <code>treated</code> dummy is 1 only for California from 1988 onward
    (13&nbsp;rows).
    The other two files carry the <strong>spatial structure</strong>, which the third estimator
    needs and which the outcome panel cannot express.
    <code>python_sc_bayes_spatial_spatial_edges.csv</code> is the 38&times;38 donor-to-donor rook
    contiguity matrix in long form: one row per adjacent pair, 150 directed rows = 75 undirected
    borders. <code>python_sc_bayes_spatial_spatial_summary.csv</code> is one row per donor with its
    degree, its exposure to California, and its neighbour list.
    The single most consequential fact in these files: <strong>exactly one donor borders
    California.</strong> Oregon and Arizona do too, but neither is in the donor pool.
  kpis:
    - {n: 3, l: "datasets"}
    - {n: 39, l: "states"}
    - {n: "1,209", l: "panel rows"}
    - {n: 1, l: "donor bordering CA"}

dta_format_version: 118

sources:
  - name: "Abadie, Diamond & Hainmueller (2010)"
    provides: "The California tobacco panel (cigsale, retprice) and the synthetic control method itself"
    reference: "Abadie, A., Diamond, A. & Hainmueller, J. (2010). Synthetic control methods for comparative case studies: Estimating the effect of California's tobacco control program. Journal of the American Statistical Association, 105(490), 493–505. https://doi.org/10.1198/jasa.2009.ap08746"
  - name: "Sakaguchi & Tagawa (2026)"
    provides: "The Bayesian spatial spillover model, and the replication package the panel and weights are exported from"
    reference: "Sakaguchi, S. & Tagawa, H. (2026). Identification and Bayesian Inference for Synthetic Control Methods with Spillover Effects. The Econometrics Journal. https://doi.org/10.1093/ectj/utag006 (replication package: Zenodo record 19066186)."
  - name: "US Census Bureau TIGER/Line"
    provides: "The 2024 state boundary shapefile from which rook contiguity is derived"
    reference: "US Census Bureau (2024). TIGER/Line Shapefiles: States. Contiguity computed with spdep::poly2nb(queen = FALSE)."
  - name: "Software"
    provides: "Estimators"
    reference: "scspill 0.2.1 (https://quarcs-lab.github.io/scspill/); mlsynth (https://mlsynth.readthedocs.io/); Carvalho, Polson & Scott (2010, horseshoe prior); LeSage & Pace (2009, spatial econometrics)."

formulas_html: |
  <p>Three nested estimators are fitted to these files. Each keeps everything the previous one
  assumed except a single restriction:</p>
  <ul>
    <li><strong>Stage 1 &mdash; classical SCM.</strong>
      <code>α̂ = argmin ‖Y₁,pre − Y_c,pre · α‖²</code> subject to <code>α_j ≥ 0</code> and
      <code>Σ α_j = 1</code> &mdash; the <em>simplex</em>. Fitted with
      <code>mlsynth.VanillaSC</code>.</li>
    <li><strong>Stage 2 &mdash; Bayesian horseshoe SCM.</strong>
      <code>α_j | λ_j ~ N(0, λ_j²)</code> with <code>λ_j | τ ~ C⁺(0, τ)</code> &mdash; the hard
      constraint replaced by a shrinkage prior that <em>prefers</em> zero without forbidding
      anything. Fitted with <code>mlsynth.BSCM</code>, and available for free as the
      <code>ρ = 0</code> case of Stage&nbsp;3.</li>
    <li><strong>Stage 3 &mdash; Bayesian spatial SCM.</strong>
      <code>Y_c,t = ρ (w · Y₁,t + W · Y_c,t) + X_t β + u_t</code> &mdash; a spatial autoregressive
      layer on the <em>donor</em> outcomes, using the two files documented here. Dropping SUTVA
      makes a second estimand estimable: the spillover
      <code>ξ_c,t = Y_c,t − Y_c,t(0)</code> received by each donor. Fitted with
      <code>scspill.SCSPILL(method="sar")</code>.</li>
  </ul>
  <p>The <code>treated</code> dummy is <code>1 if state == "California" and year ≥ 1988 else 0</code>
  &mdash; the replication package's convention. Everything else in these files is observed data or a
  deterministic function of the TIGER/Line boundaries.</p>

caveats:
  - "<strong>Narrow predictor set.</strong> The shipped panel carries only <code>cigsale</code> and <code>retprice</code> — not the log income, youth-share or beer-sales predictors Abadie et al. (2010) matched on. This is the main reason the classical ATT here (≈ −18.4) is smaller in magnitude than the ≈ −27 usually quoted from the original paper."
  - "<strong>Treatment timing is 1988, not 1989.</strong> Proposition 99 passed in November 1988 and the tax took effect on 1 January 1989. Abadie et al. and mlsynth's own example treat 1989 as the first treated year; the scspill replication convention used here codes 1988. Neither is wrong, but they cannot be mixed — comparisons against other sources should check which convention that source used."
  - "<strong>Contiguity is a modelling choice, not a measurement.</strong> The edge list is rook contiguity from a 2024 shapefile applied to a 1970–2000 panel. Borders did not move, but 'neighbour' could reasonably have meant trade intensity, commuting flows or inverse distance instead — and the estimated spillover intensity would differ. The post's section 17 discusses when each is appropriate."
  - "<strong>Eleven states are absent.</strong> Alaska, Arizona, Florida, Hawaii, Maryland, Massachusetts, Michigan, New Jersey, New York, Oregon and Washington are excluded from the donor pool for having run their own large tobacco-control programmes. Two of them — Oregon and Arizona — border California. Their exclusion is why Nevada is California's <em>only</em> contiguous donor, and therefore why the spatial parameter is identified off a single channel."
  - "<strong>The weights are unnormalised here.</strong> Both files store raw 0/1 contiguity. Row-normalisation happens inside the estimator, not in the data."

