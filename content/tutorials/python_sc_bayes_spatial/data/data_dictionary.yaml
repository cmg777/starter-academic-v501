files:
  python_sc_bayes_spatial_source_data.csv:
    label: "State-year tobacco panel: cigarette sales + retail price"
    grain: "state-year"
    years: "1970-2000"
    coverage: "39 US states (balanced)"
    key: "state (state_id) x year"
    purpose: "Fit classical, Bayesian-horseshoe and Bayesian-spatial synthetic control for California's Proposition 99 ATT."
    note: "Balanced annual panel exported from the scspill package (Abadie et al. 2010 California tobacco data). 39 states x 31 years = 1,209 rows, no missing values. California is the treated unit; the other 38 states are donors. treated = 1 for California in 1988-2000."
  python_sc_bayes_spatial_spatial_edges.csv:
    label: "Donor-to-donor rook contiguity, long form"
    grain: "ordered state pair"
    years: "time-invariant"
    coverage: "38 donor states; 150 directed rows = 75 undirected borders"
    key: "state_i x state_j"
    purpose: "The W matrix of the SAR layer: which donors are each other's neighbours."
    note: "The 38x38 contiguity matrix in long form, one row per adjacent ordered pair. Symmetric by construction, so every border appears twice. Zero-contiguity pairs are omitted rather than stored as zeros. Reshape to a matrix with the state list from the summary file. Row-normalisation happens inside the estimator."
  python_sc_bayes_spatial_spatial_summary.csv:
    label: "Per-donor spatial summary: degree and exposure to California"
    grain: "state"
    years: "time-invariant"
    coverage: "38 donor states"
    key: "state"
    purpose: "The w vector of the SAR layer (exposure to the treated unit), plus each donor's position in the contiguity graph."
    note: "One row per donor. w_california IS the w vector the model needs, and it has exactly one non-zero entry: Nevada. Degree ranges from 1 to 8 with a mean of 3.95."

columns:
  state:
    label: "State name"
    definition: "US state identifier. The treated unit is California; the other 38 states are donors."
    construction: "From the scspill package panel (Abadie et al. 2010)."
    units: "string"
    source: "scspill package (Abadie et al. 2010)"
    coverage: "39 states in the panel, 38 in the spatial files"
    kind: str
  state_id:
    label: "State numeric ID"
    definition: "Integer index for the state (1-39)."
    construction: "Sequential package index aligned to the alphabetical state list."
    units: "integer (1-39)"
    source: "scspill package"
    coverage: "39 states"
    kind: id
  year:
    label: "Calendar year"
    definition: "Annual time index of the panel."
    construction: "Observed year, 1970-2000 (balanced; 31 years per state)."
    units: "year"
    source: "scspill package (Abadie et al. 2010)"
    coverage: "1970-2000"
    kind: year
  cigsale:
    label: "Per-capita cigarette sales (packs)"
    definition: "Annual per-capita cigarette pack sales. This is the synthetic-control outcome."
    construction: "Observed tax-paid cigarette sales per capita, from the Abadie et al. (2010) tobacco data."
    units: "packs per capita per year"
    source: "Abadie et al. (2010) via scspill"
    coverage: "1,209 observations, no missing"
    kind: cont
  retprice:
    label: "Real retail cigarette price"
    definition: "Average retail price per pack. The single covariate entering the SAR layer."
    construction: "Observed state-level retail price, from the Abadie et al. (2010) tobacco data."
    units: "cents per pack"
    source: "Abadie et al. (2010) via scspill"
    coverage: "1,209 observations, no missing"
    kind: cont
  treated:
    label: "Treatment indicator"
    definition: "1 for California from 1988 onward; 0 otherwise. Note this is 1988, not 1989 — see the caveats."
    construction: "Constructed as 1 if state == 'California' and year >= 1988 else 0 (the replication package's convention)."
    units: "0/1"
    source: "Constructed"
    coverage: "13 treated rows of 1,209"
    kind: dummy
  state_i:
    label: "Origin state of the contiguity pair"
    definition: "The donor state whose neighbour is recorded in state_j."
    construction: "Row index of the 38x38 rook contiguity matrix."
    units: "string"
    source: "TIGER/Line 2024 boundaries, spdep::poly2nb(queen = FALSE)"
    coverage: "38 donor states"
    kind: str
  state_j:
    label: "Neighbour state of the contiguity pair"
    definition: "A donor state sharing a land border with state_i."
    construction: "Column index of the 38x38 rook contiguity matrix, kept only where the entry is 1."
    units: "string"
    source: "TIGER/Line 2024 boundaries, spdep::poly2nb(queen = FALSE)"
    coverage: "38 donor states"
    kind: str
  contiguous:
    label: "Shares a land border"
    definition: "Always 1 in this file — zero-contiguity pairs are omitted rather than stored."
    construction: "Rook contiguity: 1 if the two states share a boundary segment, not merely a corner."
    units: "0/1"
    source: "TIGER/Line 2024 boundaries"
    coverage: "150 directed rows = 75 undirected borders"
    kind: dummy
  degree:
    label: "Number of neighbouring donors"
    definition: "How many other donor states this state borders. Its row sum in W."
    construction: "Row sum of the 38x38 rook contiguity matrix."
    units: "count"
    source: "Derived from the contiguity matrix"
    coverage: "range 1-8, mean 3.95"
    kind: cont
  w_california:
    label: "Contiguity with California"
    definition: "1 if this donor borders California, 0 otherwise. THIS IS the w vector of the SAR model."
    construction: "California's row of the full 39x39 contiguity matrix, restricted to the donor pool."
    units: "0/1"
    source: "TIGER/Line 2024 boundaries"
    coverage: "exactly one non-zero entry: Nevada"
    kind: dummy
  borders_california:
    label: "Borders California (flag)"
    definition: "Integer duplicate of w_california, for convenience when filtering."
    construction: "1 if w_california > 0."
    units: "0/1"
    source: "Derived"
    coverage: "1 of 38 donors"
    kind: dummy
  neighbour_list:
    label: "Comma-separated neighbour names"
    definition: "The donor states this state borders, listed alphabetically. Human-readable form of the edge list."
    construction: "Names of the non-zero entries of this state's row of W."
    units: "string"
    source: "Derived from the contiguity matrix"
    coverage: "38 donor states"
    kind: str
