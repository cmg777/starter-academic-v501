# Data dictionary metadata for python_bridge_impact — drives build_data_dictionary.py.
# Edit this file and rerun `python build_data_dictionary.py` to regenerate everything.

study:
  title: "Evaluating the Impact of the Jamuna Bridge"
  subtitle: "Companion data for a Python replication of Blankespoor, Emran, Shilpi and Xu (2021) on the difference-in-differences evaluation of Bangladesh's Jamuna Bridge."
  overview: >
    Companion data for a hands-on Python tutorial that evaluates the economic impact of the
    <strong>Jamuna (Bangabandhu) Bridge</strong>, a 4.8&nbsp;km crossing that opened in June 1998,
    cost about US\$985 million, connected roughly 26&nbsp;million people in isolated northwest
    Bangladesh to Dhaka, and cut freight costs by about half. The design is a two-group,
    non-staggered <strong>difference-in-differences</strong>: the <strong>Jamuna hinterland</strong>
    is treated, and the <strong>Padma hinterland</strong> &mdash; a symmetric region cut off by the
    other great river, whose own bridge was not started until 2015 &mdash; is the comparison. The
    Dhaka&ndash;Chittagong core is excluded. These five files are tidy CSV exports of the authors'
    original Stata replication package, unchanged in value; only the file format and column
    selection differ. The tutorial reproduces all 122 published coefficients to three decimals.
  panel_structure: >
    <strong>Five files, four outcome families.</strong>
    <code>bridge_nightlights</code> is the richest panel: 359 upazilas (subdistricts) &times; seven
    three-year periods of DMSP-OLS satellite luminosity, 1992&ndash;2013.
    <code>bridge_employment</code> holds three population censuses (1991, 2001, 2011) for 351
    upazilas, carrying population density and the agriculture/industry/services employment shares.
    <code>bridge_yield</code> is Boro rice yield for 16 former districts over eight periods,
    1988&ndash;2013. <code>bridge_dhs_household</code> and <code>bridge_dhs_village</code> are
    village-year records from the Demographic and Health Surveys and the Household Income and
    Expenditure Survey, used as a placebo test on public goods.
    <strong>Critical:</strong> the <code>year</code> column is an integer <em>period index</em>
    (1, 2, 3&hellip;), not a calendar year &mdash; annual satellite and yield data are averaged into
    three-year blocks. The controls interact baseline characteristics with this index, so
    substituting calendar years changes every coefficient.
  kpis:
    - {n: 5, l: "datasets"}
    - {n: 88, l: "variables"}
    - {n: "123 / 125", l: "treated / comparison upazilas"}
    - {n: "1988–2013", l: "years"}

dta_format_version: 118

sources:
  - name: "Blankespoor, Emran, Shilpi and Xu (2021)"
    provides: "The replicated study and the complete Stata replication package these CSVs are derived from — four do-files, five .dta files, execution logs, and every intermediate result table"
    reference: "Blankespoor, B., Emran, M. S., Shilpi, F., & Xu, L. (2021). Bridge to bigpush or backwash? Market integration, reallocation and productivity effects of Jamuna Bridge in Bangladesh. Journal of Economic Geography. Working-paper version: World Bank Policy Research Working Paper 8508, https://doi.org/10.1596/1813-9450-8508"
  - name: "DMSP-OLS Nighttime Lights"
    provides: "Satellite luminosity at 1 km pixel resolution, averaged to the upazila and then into three-year blocks (variable mn)"
    reference: "NOAA National Centers for Environmental Information, Earth Observation Group. https://www.ncei.noaa.gov/products/dmsp-operational-linescan-system"
  - name: "IPUMS International"
    provides: "Bangladesh population censuses 1991, 2001 and 2011 — individual and household records collapsed to the upazila (pop, emp, pop_agr, pop_ind, pop_serv, density, surban, prop_elec)"
    reference: "Minnesota Population Center. https://international.ipums.org/international/"
  - name: "Bangladesh Bureau of Statistics"
    provides: "Annual Boro rice yield by former district (yld), from the Yearbook of Agricultural Statistics 2016; and the Household Income and Expenditure Survey 1995/96"
    reference: "Yearbook of Agricultural Statistics 2016, Bangladesh Bureau of Statistics."
  - name: "The DHS Program"
    provides: "Household and village questionnaire records for the public-goods placebo (electricity, water, sanitation, distances to schools, clinics, banks and post offices)"
    reference: "Bangladesh Demographic and Health Surveys 1993, 1997, 2003, 2007, 2011, 2014. https://dhsprogram.com/"
  - name: "NOAA PREC/L"
    provides: "Monthly precipitation reconstruction over land, extracted at the upazila level (rainm, rainsd)"
    reference: "NOAA Precipitation Reconstruction over Land, NOAA Physical Sciences Laboratory. https://psl.noaa.gov/data/gridded/data.precl.html"
  - name: "Method references"
    provides: "The two doubly-robust estimators and the sensitivity analysis"
    reference: "Kline (2011, Oaxaca-Blinder as a reweighting estimator); Busso, Gregory & Kline (2013); Rambachan & Roth (2023, HonestDiD)."

formulas_html: |
  <p>The bridge is treated as a <strong>quasi-natural experiment</strong>: which river got a bridge
  first was decided by political geography &mdash; President Ershad's base in Rangpur and Prime
  Minister Khaleda Zia's in Bogra, both in the Jamuna hinterland &mdash; rather than by economic
  prospects in the northwest. The comparison region stayed isolated for the whole window because
  the Padma bridge was not begun until 2015.</p>
  <ul class="tight">
    <li><strong>Mean effect</strong>:
      <code>Y_it = &theta;0 + &mu;_i + &mu;_t + &theta;1&middot;(D_J &times; D_post) + &Sigma; &beta;_q X_qit + &Sigma; &pi;_m (Z_mi0 &times; t) + &epsilon;_it</code>,
      with upazila fixed effects <code>&mu;_i</code>, period fixed effects <code>&mu;_t</code>, and
      the estimand the <strong>ATT</strong>.</li>
    <li><strong>Short run vs long run</strong>: replace the single post switch with two,
      <code>&delta;1&middot;(D_J &times; D_SR)</code> and <code>&delta;2&middot;(D_J &times; D_LR)</code>.
      This is where population density reverses sign, from &minus;2.5% to +5.9%.</li>
    <li><strong>Derived controls</strong>: <code>mdist = min(jamuna_m, padma_m)/1000</code>;
      <code>lmdist = ln(mdist + 1)</code>; <code>lpop91 = ln(pop91)</code>;
      <code>lpop91_t = lpop91 &times; year</code>; <code>lmdist_t = lmdist &times; year</code>.
      The trend interactions matter: unit fixed effects already absorb the time-invariant levels,
      so entering them alone would do nothing. Interacting them relaxes parallel trends from
      &ldquo;all upazilas trend alike&rdquo; to &ldquo;upazilas that started alike trend alike&rdquo;.</li>
    <li><strong>Rainfall logs differ by file</strong>: <code>ln(rainm + 1)</code> for the
      nightlights panel (it contains zeros), plain <code>ln(rainm)</code> for the census and yield
      panels. This is not cosmetic &mdash; it changes which rows survive.</li>
    <li><strong>Outcomes</strong>: <code>lmn = ln(mn + 1)</code> (luminosity is bottom-coded at 1.0);
      <code>lyld = ln(yld)</code>; <code>ldensity = ln(density)</code>;
      <code>sagr = pop_agr/emp</code>, <code>sind = pop_ind/emp</code>,
      <code>sserv = pop_serv/emp</code>.</li>
    <li><strong>Two doubly-robust weights</strong>, both estimated on the <code>smp1</code> sample:
      LWDR uses the propensity odds <code>p/(1&minus;p)&middot;(1&minus;&pi;)/&pi;</code>; KOBDR uses
      Kline's Oaxaca-Blinder projection of the treated covariate mean onto the comparison design.
      Both put weight 1 on treated units, which is what makes them <strong>ATT</strong> weights.</li>
  </ul>

caveats:
  - "<strong>year is a period index, not a calendar year.</strong> Nightlights and yields are averaged into three-year blocks. The mapping is in the <code>year</code> row of each dataset below. Because the controls interact baseline traits with this index, substituting calendar years changes every coefficient."
  - "<strong>smp1 is the sample filter, and it is deliberately missing.</strong> It is missing for the Dhaka–Chittagong core region (<code>treatd == 1</code>), which is neither treated nor a credible comparison. Filtering on <code>smp1.notna()</code> is how the core is excluded from every regression. In the two DHS files there is no core, so <code>smp1</code> is identical to <code>treat</code>."
  - "<strong>Distances are to the relevant crossing.</strong> <code>mdist = min(jamuna_m, padma_m)</code> gives each upazila its distance to the Jamuna bridge if it is in the treated hinterland, or to the planned Padma crossing if it is in the comparison hinterland. It is not distance to a single point."
  - "<strong>The yield panel is very thin.</strong> Sixteen former districts, of which eleven enter the estimation and nine survive the negative-weight drop. Cluster-robust inference with nine clusters is fragile; treat the yield magnitudes as indicative."
  - "<strong>The census panel has one pre-bridge year.</strong> Only 1991 precedes the bridge, so no pre-trend test is possible for population density or the employment shares — only a level-balance test. This includes the density variable that settles the paper's theoretical question."
  - "<strong>Village-questionnaire columns named like presence indicators are often distances.</strong> <code>post_office</code> and <code>cinema</code> are labelled as distances in the original Stata data despite being filed under &ldquo;Presence of&rdquo; in the published table. <code>grameen_bank</code>, <code>co_operative_soc</code> and <code>NGO</code> are genuine presence dummies."
  - "<strong>Missingness is heavy in the village file.</strong> <code>dist_satellite_clinic</code> (398 non-missing), <code>NGO</code> (413), <code>dist_Thana</code> (559) and <code>dist_district</code> (618) are far from complete, which is why the public-goods regressions have wildly different sample sizes."
  - "<strong>These are the authors' data, unchanged.</strong> Values are byte-faithful to the original <code>.dta</code> files; only the format and the column selection differ. Any error in the source data is preserved here."

citation:
  author: "Mendez, C."
  year: "2026"
  title: "Evaluating the Impact of Infrastructure: A Beginner's Guide to Difference-in-Differences with the Jamuna Bridge — companion data"
  extra_apa: "Data derived from the replication package of Blankespoor, B., Emran, M. S., Shilpi, F., & Xu, L. (2021), Journal of Economic Geography. Please cite the original authors for the data."
  extra_bibtex: "note = {Data derived from the replication package of Blankespoor, Emran, Shilpi and Xu (2021)}"

files:
  bridge_nightlights.csv:
    label: "Nighttime lights panel"
    grain: "one row per upazila x three-year period"
    years: "1992–2013 (7 periods)"
    coverage: "359 upazilas; 127 treated, 125 comparison, 107 core"
    key: "geocode + year"
    purpose: "The running example of the tutorial: the richest panel, used to teach the 2x2, two-way fixed effects, the event study, both doubly-robust estimators, and the sensitivity analysis."
    note: "Luminosity mn is bottom-coded at 1.0, so most rural upazilas sit near the floor; the tutorial uses ln(mn + 1). pop91 is missing for 4 upazilas and rainsd is zero for 28, which is why the estimation sample is 247 rather than 252 upazilas."
  bridge_employment.csv:
    label: "Population census panel"
    grain: "one row per upazila x census year"
    years: "1991, 2001, 2011 (3 periods)"
    coverage: "351 upazilas; 123 treated, 125 comparison, 103 core"
    key: "geocode + year"
    purpose: "Carries population density and the sectoral employment shares — including the density variable that discriminates between the backwash and comparative-advantage theories."
    note: "Only 1991 is pre-bridge, so no pre-trend test is possible here. 24 rows have zero recorded rainfall and drop when the log controls are built, taking the estimation sample from 248 to 246 upazilas."
  bridge_yield.csv:
    label: "Boro rice yield panel"
    grain: "one row per former district x three-year period"
    years: "1988–2013 (8 periods)"
    coverage: "16 former districts; 5 treated, 6 comparison, 5 core"
    key: "dist + year"
    purpose: "Agricultural productivity — the outcome where the spatial heterogeneity is most dramatic, with the farthest distance band gaining 26.5 percent against 4.9 percent nearest."
    note: "Agricultural statistics in Bangladesh are published at the old district level, so this entire result rests on 9 to 11 clusters. Two districts (Faridpur, Patuakhali) receive negative Oaxaca-Blinder weights and drop from the weighted specifications."
  bridge_dhs_household.csv:
    label: "DHS/HIES household questionnaire"
    grain: "one row per village (survey cluster) x survey year"
    years: "1994, 1996, 1997, 2003, 2007, 2011, 2013 (7 rounds)"
    coverage: "37 districts; 16 treated, 21 comparison"
    key: "Cluster + year"
    purpose: "The public-goods placebo. Tests the rival political-economy explanation that a prime minister with roots in the Jamuna hinterland simply sent more services there."
    note: "No core region and no smp1 filter — smp1 is numerically identical to treat. Clustering is at the District level because upazila identifiers are not released for DHS rounds before 2003. Floor is missing for 183 rows."
  bridge_dhs_village.csv:
    label: "DHS village questionnaire"
    grain: "one row per village (survey cluster) x survey year"
    years: "1994, 1996, 1997, 2003, 2007, 2011, 2013 (7 rounds)"
    coverage: "41 districts; 20 treated, 21 comparison"
    key: "Cluster + year"
    purpose: "The infrastructure half of the public-goods placebo: distances to schools, clinics, headquarters, and the presence of banks, cooperatives and NGO programmes."
    note: "Missingness is heavy and uneven, which is why the twelve placebo regressions run on samples ranging from 398 to 1,449 observations. Zero of the 21 resulting estimates are significant at 5 percent."

columns:
  # ---- identifiers and design -------------------------------------------------
  geocode:
    label: "Upazila code"
    definition: "Bangladesh upazila (subdistrict) identifier, harmonised across census rounds."
    construction: "Master administrative code. Upazilas that split or merged between rounds were matched by superimposing digital maps and applying area weights, so the panel is comparable over time."
    units: "code"
    source: "Blankespoor et al. (2021) replication package"
    kind: "id"
  dist:
    label: "District code"
    definition: "District identifier. In the yield file this is the unit of observation (former district); elsewhere it is an upper-level grouping."
    construction: "Master administrative code."
    units: "code"
    source: "Blankespoor et al. (2021) replication package"
    kind: "id"
  former_dis:
    label: "Former district"
    definition: "Old-district identifier used by the agricultural statistics, which were never re-issued on the modern district boundaries."
    construction: "Value-labelled in the original .dta: 2 Barisal, 3 Bogra, 5 Comilla, 6 Dhaka, 7 Dinajpur, 8 Faridpur, 9 Jamalpur, 10 Jessore, 12 Khulna, 13 Kishoreganj, 14 Kushtia, 15 Mymensingh, 17 Pabna, 18 Patuakhali, 19 Rajshahi, 21 Rangpur, 23 Tangail."
    units: "code"
    source: "Bangladesh Bureau of Statistics"
    kind: "id"
  div:
    label: "Division code"
    definition: "Administrative division: 1 Barisal, 2 Chittagong, 3 Dhaka, 4 Khulna, 5 Rajshahi."
    construction: "Master administrative code."
    units: "code"
    source: "Blankespoor et al. (2021) replication package"
    kind: "id"
  Division:
    label: "Division (DHS)"
    definition: "Administrative division as coded in the DHS files: 1 Barisal, 2 Chittagong, 3 Dhaka, 4 Khulna, 5 Rajshahi, 6 Sylhet."
    construction: "DHS survey variable."
    units: "code"
    source: "The DHS Program"
    kind: "id"
  District:
    label: "District (DHS)"
    definition: "District identifier in the DHS files. This is the clustering and fixed-effect level for the public-goods placebo, because upazila identifiers are not released for survey rounds before 2003."
    construction: "DHS survey variable."
    units: "code"
    source: "The DHS Program"
    kind: "id"
  Cluster:
    label: "Survey cluster (village)"
    definition: "DHS primary sampling unit — effectively a village. The unit of observation in both DHS files."
    construction: "DHS survey variable."
    units: "code"
    source: "The DHS Program"
    kind: "id"
  year:
    label: "Period index"
    definition: "Integer period index, NOT a calendar year. Nightlights: 1=1992-94, 2=1995-97, 3=1998-2000, 4=2001-04, 5=2005-07, 6=2008-10, 7=2011-13. Census: 1=1991, 2=2001, 3=2011. Yield: 1=1988-91, 2=1992-94, 3=1995-97, 4=1998-2000, 5=2001-04, 6=2005-07, 7=2008-10, 8=2011-13. DHS: 1=1994, 2=1996, 3=1997, 4=2003, 5=2007, 6=2011, 7=2013."
    construction: "Annual satellite and yield series are averaged into three-year blocks to smooth transitory shocks. The bridge opened in June 1998, inside nightlights period 3 and yield period 4."
    units: "index"
    source: "Blankespoor et al. (2021) replication package"
    kind: "year"
  treat:
    label: "Jamuna hinterland (treated)"
    definition: "1 if the unit lies in the Jamuna hinterland, the region the bridge connected; 0 otherwise."
    construction: "Assigned by geography: which side of which river the unit sits on."
    units: "0/1"
    source: "Blankespoor et al. (2021) replication package"
    kind: "dummy"
  smp1:
    label: "Estimation sample"
    definition: "Non-missing for the Jamuna and Padma hinterlands; MISSING for the Dhaka–Chittagong core. Filtering on non-missing is how the core is excluded from every regression."
    construction: "Missing wherever treatd == 1. In the two DHS files there is no core, so this variable is numerically identical to treat."
    units: "0/1 or missing"
    source: "Blankespoor et al. (2021) replication package"
    kind: "dummy"
  treatd:
    label: "Core region (excluded)"
    definition: "1 for the Dhaka–Chittagong core and adjacent areas. Used only for descriptive comparison in the paper's Appendix Table AT.1, never as a DiD comparison group."
    construction: "The authors dropped core estimates from the published design after a referee pointed out that the Padma hinterland is not a valid comparison for the core."
    units: "0/1"
    source: "Blankespoor et al. (2021) replication package"
    kind: "dummy"
  yr:
    label: "Post-bridge (DHS)"
    definition: "1 for survey rounds after the bridge opened (2003 onward); 0 for 1994, 1996 and 1997."
    construction: "Pre-coded in the DHS source files."
    units: "0/1"
    source: "Blankespoor et al. (2021) replication package"
    kind: "dummy"
  jamuna_m:
    label: "Distance to the Jamuna bridge"
    definition: "Crow-fly distance from the unit centroid to the Jamuna bridge foot."
    construction: "Computed in ArcGIS from upazila-level shapefiles for Bangladesh."
    units: "metres"
    source: "Blankespoor et al. (2021), from Bangladesh shapefiles"
    kind: "cont"
  padma_m:
    label: "Distance to the Padma crossing"
    definition: "Crow-fly distance from the unit centroid to the planned Padma bridge site."
    construction: "Computed in ArcGIS from upazila-level shapefiles for Bangladesh."
    units: "metres"
    source: "Blankespoor et al. (2021), from Bangladesh shapefiles"
    kind: "cont"
  pop91:
    label: "Population in 1991"
    definition: "Total population recorded in the 1991 census — a baseline characteristic fixed before the bridge."
    construction: "Used in the propensity model and, interacted with the period index, as a control that lets initially-large units follow a different trajectory."
    units: "persons"
    source: "IPUMS International"
    kind: "cont"
  rainm:
    label: "Mean rainfall"
    definition: "Average monthly precipitation over the period."
    construction: "Extracted at the upazila level from the NOAA PREC/L gridded reconstruction. Enters the regressions as ln(rainm + 1) for nightlights and ln(rainm) elsewhere."
    units: "cm per month"
    source: "NOAA PREC/L"
    kind: "cont"
  rainsd:
    label: "Rainfall variability"
    definition: "Standard deviation of monthly precipitation over the period — a control for weather risk, which matters directly for agricultural yield."
    construction: "Extracted at the upazila level from NOAA PREC/L. Zero values become missing under the log transform, which is what removes 28 nightlights upazilas from the estimation sample."
    units: "cm per month"
    source: "NOAA PREC/L"
    kind: "cont"

  # ---- outcomes ---------------------------------------------------------------
  mn:
    label: "Average nightlight luminosity"
    definition: "Mean DMSP-OLS digital-number luminosity over the upazila, averaged across the three-year block."
    construction: "1 km satellite pixels averaged to the upazila boundary, then across years. BOTTOM-CODED AT 1.0 — the minimum in the data is exactly 1.0, so most rural upazilas sit at the floor. The tutorial uses ln(mn + 1) for this reason."
    units: "digital number (0–63 scale)"
    source: "DMSP-OLS, NOAA Earth Observation Group"
    kind: "cont"
  yld:
    label: "Boro rice yield"
    definition: "Yield of Boro rice, the dry-season irrigated crop that dominates Bangladeshi cereal production."
    construction: "Annual district figures averaged into three-year blocks. Enters the regressions as ln(yld)."
    units: "metric tons per hectare"
    source: "Yearbook of Agricultural Statistics 2016, Bangladesh Bureau of Statistics"
    kind: "cont"
  density:
    label: "Population density"
    definition: "Population per square kilometre. This is the outcome that discriminates between the backwash and comparative-advantage theories: backwash requires it to fall, and it rises 5.9 percent in the long run."
    construction: "Census population divided by upazila land area. Enters as ln(density)."
    units: "persons per sq km"
    source: "IPUMS International"
    kind: "cont"
  pop:
    label: "Total population"
    definition: "Total population recorded in the census round."
    construction: "Individual census records collapsed to the upazila."
    units: "persons"
    source: "IPUMS International"
    kind: "cont"
  emp:
    label: "Total employment"
    definition: "Total employed population — the denominator of the three sectoral shares."
    construction: "Individual census records collapsed to the upazila."
    units: "persons"
    source: "IPUMS International"
    kind: "cont"
  pop_agr:
    label: "Employed in agriculture"
    definition: "Number employed in agriculture. Divided by emp it gives the agriculture share, which falls 1.3 percentage points on average and 5.7 points in the farthest distance band."
    construction: "Individual census records collapsed to the upazila."
    units: "persons"
    source: "IPUMS International"
    kind: "cont"
  pop_ind:
    label: "Employed in industry"
    definition: "Number employed in industry and manufacturing. The share falls 1.2 percentage points in the long run — roughly a third of a 2.8 percent baseline sector."
    construction: "Individual census records collapsed to the upazila. Logged as ln(pop_ind + 1) in the original code because some upazilas have very few industrial workers."
    units: "persons"
    source: "IPUMS International"
    kind: "cont"
  pop_serv:
    label: "Employed in services"
    definition: "Number employed in services — trading, transport and processing, the activities a region takes on when it starts shipping output. The share rises 2.4 percentage points in the long run."
    construction: "Individual census records collapsed to the upazila."
    units: "persons"
    source: "IPUMS International"
    kind: "cont"
  surban:
    label: "Urban share"
    definition: "Share of the upazila population classified as urban."
    construction: "Census classification. Used descriptively rather than as a regression outcome."
    units: "share (0–1)"
    source: "IPUMS International"
    kind: "cont"
  prop_elec:
    label: "Household electrification"
    definition: "Proportion of households with electricity."
    construction: "Census household records collapsed to the upazila. Used in the paper's Appendix Table AT.1 to establish that the Jamuna hinterland lagged the core before the bridge."
    units: "share (0–1)"
    source: "IPUMS International"
    kind: "cont"

  # ---- DHS household questionnaire --------------------------------------------
  rural:
    label: "Rural village"
    definition: "1 if the survey cluster is rural. Entered as a control in the household regression because it dominates every service-access outcome."
    construction: "DHS survey variable."
    units: "0/1"
    source: "The DHS Program"
    kind: "dummy"
  Electricity:
    label: "Access to electricity"
    definition: "Share of households in the village with electricity — the one household-questionnaire outcome carried into the paper's published Table 3."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  DrinkWater:
    label: "Piped water"
    definition: "Share of households with piped drinking water. One of the few pre-bridge characteristics on which the two hinterlands differ significantly."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  Toilet:
    label: "Flush toilet"
    definition: "Share of households with a flush toilet."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  Floor:
    label: "Cement floor"
    definition: "Share of households with a cement floor — a standard asset proxy. Missing for 183 rows."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  Roof:
    label: "Cement or corrugated roof"
    definition: "Share of households with a cement or corrugated-iron roof."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  Age:
    label: "Mean age"
    definition: "Average age of household members in the village."
    construction: "DHS household records averaged to the survey cluster."
    units: "years"
    source: "The DHS Program"
    kind: "cont"
  age5:
    label: "Share under 5"
    definition: "Share of the village population below five years of age."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  age60:
    label: "Share over 60"
    definition: "Share of the village population above sixty. Significantly lower in the Jamuna hinterland before the bridge — one of the demographic imbalances the paper acknowledges."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  female:
    label: "Share female"
    definition: "Share of the village population that is female."
    construction: "DHS household records averaged to the survey cluster."
    units: "share (0–1)"
    source: "The DHS Program"
    kind: "cont"
  hsize:
    label: "Average household size"
    definition: "Mean number of members per household in the village."
    construction: "DHS household records averaged to the survey cluster."
    units: "persons"
    source: "The DHS Program"
    kind: "cont"

  # ---- DHS village questionnaire ----------------------------------------------
  Urban:
    label: "Settlement type"
    definition: "Village classification: 1 rural area, 2 SMA, 3 municipality area, 4 other urban."
    construction: "DHS village questionnaire."
    units: "code"
    source: "The DHS Program"
    kind: "cont"
  dist_Thana:
    label: "Distance to thana headquarters"
    definition: "Distance from the village to the thana (police-subdistrict) headquarters. Non-missing for only 559 rows."
    construction: "DHS village questionnaire, reported in miles."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  dist_district:
    label: "Distance to district headquarters"
    definition: "Distance from the village to the district headquarters. Non-missing for 618 rows."
    construction: "DHS village questionnaire, reported in miles."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  dist_hos:
    label: "Distance to hospital"
    definition: "Distance from the village to the nearest hospital."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  dist_satellite_clinic:
    label: "Distance to satellite clinic"
    definition: "Distance to the nearest satellite health clinic. The sparsest variable in the file, non-missing for only 398 rows."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  primary_school:
    label: "Distance to primary school"
    definition: "Distance from the village to the nearest primary school."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  high_school:
    label: "Distance to high school"
    definition: "Distance from the village to the nearest high school. Its long-run estimate of +0.535 (0.290) is the only marginally significant coefficient among the 21 public-goods tests — and it has the wrong sign for the political-economy story, since it says schools got farther away."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  madrassa_school:
    label: "Distance to madrassa"
    definition: "Distance from the village to the nearest madrassa school."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  post_office:
    label: "Distance to post office"
    definition: "Distance to the nearest post office. NOTE: filed under 'Presence of' in the paper's published Table 3, but labelled as a distance in the source data."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  cinema:
    label: "Distance to cinema"
    definition: "Distance to the nearest cinema. Like post_office, filed under 'Presence of' in the published table but a distance in the data."
    construction: "DHS village questionnaire."
    units: "miles"
    source: "The DHS Program"
    kind: "cont"
  grameen_bank:
    label: "Grameen Bank present"
    definition: "Whether the village has a Grameen Bank branch — a genuine presence indicator."
    construction: "DHS village questionnaire. Note that the raw variable carries an occasional code 9, so the mean exceeds a clean 0/1 share."
    units: "0/1"
    source: "The DHS Program"
    kind: "cont"
  co_operative_soc:
    label: "Cooperative society present"
    definition: "Whether the village has a cooperative society. Its true short-run estimate is 0.090 (0.108); the published Table 3 prints 0.420, which is in fact the post_office coefficient — see section 18.2 of the companion post."
    construction: "DHS village questionnaire."
    units: "0/1"
    source: "The DHS Program"
    kind: "dummy"
  NGO:
    label: "Income-generating NGO present"
    definition: "Whether an income-generating NGO operates in the village. Non-missing for only 413 rows, and the treatment terms are dropped for collinearity in the placebo regression."
    construction: "DHS village questionnaire."
    units: "0/1"
    source: "The DHS Program"
    kind: "dummy"
