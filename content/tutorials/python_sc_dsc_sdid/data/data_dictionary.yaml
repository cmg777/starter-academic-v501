files:
  brexit_analysis.csv:
    label: "Brexit estimation panel: 24 OECD countries, 1995Q1-2020Q4"
    grain: "country-quarter"
    years: "1995Q1–2020Q4 (104 quarters; projections from 2018Q4)"
    coverage: "24 OECD countries: the United Kingdom (treated) and 23 donors; balanced, no missing values"
    key: "country × t (equivalently unit_id × t)"
    purpose: "The only data file the tutorial loads. Every estimator uses log_rgdp; the covariate sections also use the six covariates."
    note: "Byte-identical copy of the post-root brexit_analysis.csv (and of r_sc_dsc_sdid/brexit_analysis.csv). Built by r_sc_dsc_sdid/prepare_data.R from the de Brabander, Juodis and Miyazato Szini (2025) replication package. Treatment at 2016Q3 (t = 87); T0 = 86; evaluation at 2018Q4 (t = 96) and 2019Q4 (t = 100). Values from 2018Q4 on are OECD projections."
  brexit_panel_wide.csv:
    label: "Full OECD source panel: 36 countries, 1960Q1-2020Q4, 12 series"
    grain: "country-quarter"
    years: "1960Q1–2020Q4 (244 quarters; projections from 2018Q4)"
    coverage: "36 OECD countries; unbalanced, empty cells where the source has no value"
    key: "country × date_dec"
    purpose: "Rebuild the estimation sample, try a different donor pool, window or covariate, or study the series before 1995."
    note: "Lossless pivot of r_sc_dsc_sdid/brexit_panel_long.csv by make_wide_panel.py (values rounded to 10 significant digits by prepare_data.R). in_estimation_sample is the only derived column. Filter in_estimation_sample == 1 and 1995Q1-2020Q4 to recover the countries and quarters of brexit_analysis."

columns:
  # ── shared identifiers ────────────────────────────────────────────────────
  country:
    label: "Country name"
    definition: "OECD country name, in English, as stored in the source file."
    units: "text"
    source: "OECD Economic Outlook, via the replication package"
    coverage: "24 countries in brexit_analysis; 36 in brexit_panel_wide"
    kind: str
  year:
    label: "Calendar year"
    definition: "Calendar year of the quarter."
    units: "year"
    coverage: "1995–2020 in brexit_analysis; 1960–2020 in brexit_panel_wide"
    kind: year
  quarter:
    label: "Quarter of the year (1-4)"
    definition: "Quarter within the calendar year: 1 = January–March, …, 4 = October–December."
    units: "1–4"
    kind: id
  quarter_label:
    label: "Quarter label, e.g. 2016Q3"
    definition: "Human-readable quarter, year followed by Q and the quarter number. Sorts correctly as text."
    construction: "year + 'Q' + quarter"
    units: "text"
    kind: str
  date_dec:
    label: "Decimal year (2016Q3 = 2016.50)"
    definition: "Time as a decimal year, the start of the quarter: year + (quarter − 1)/4. Convenient for plotting on a continuous axis."
    construction: "year + (quarter − 1) / 4"
    units: "years"
    kind: cont

  # ── brexit_analysis: indices ──────────────────────────────────────────────
  t:
    label: "Period index, 1 = 1995Q1 ... 104 = 2020Q4"
    definition: "Consecutive quarter index used as the time variable. Key values: 86 = 2016Q2 (last pre-treatment quarter), 87 = 2016Q3 (treatment), 96 = 2018Q4 and 100 = 2019Q4 (evaluation quarters)."
    construction: "4 × (year − 1995) + quarter"
    units: "quarters"
    kind: id
  unit_id:
    label: "Country index, 1-24, alphabetical"
    definition: "Integer country identifier in alphabetical order of country. The United Kingdom is 23."
    units: "1–24"
    kind: id

  # ── brexit_analysis: outcome and covariates ───────────────────────────────
  log_rgdp:
    label: "Outcome: log real GDP, indexed to the country's 1995 average"
    definition: "Natural log of real GDP divided by the country's own 1995 average, so it is about 0 in 1995 and approximates cumulative growth since then. The outcome of every estimator in the post."
    construction: "ln(real_gdp) = ln(real_gdp_raw / mean of real_gdp_raw over 1995Q1–1995Q4)"
    units: "log points (0.01 ≈ 1%)"
    source: "OECD Economic Outlook (Nov 2018 vintage), normalised by Born et al. (2019)"
    coverage: "complete; projected from 2018Q4"
    kind: cont
  cons_share:
    label: "Real private consumption / real GDP"
    definition: "Private consumption as a share of GDP, both in real (volume) terms."
    construction: "real_con_raw / real_gdp_raw"
    units: "ratio (0.54 = 54% of GDP)"
    source: "OECD Economic Outlook; construction as in the replication code"
    coverage: "complete"
    kind: cont
  inv_share:
    label: "Real investment / real GDP"
    definition: "Investment as a share of GDP, both in real terms."
    construction: "real_inv_raw / real_gdp_raw"
    units: "ratio"
    source: "OECD Economic Outlook; construction as in the replication code"
    coverage: "complete"
    kind: cont
  exp_share:
    label: "Real exports / real GDP"
    definition: "Exports of goods and services as a share of GDP, both in real terms. Can exceed 1 in re-export economies (Luxembourg, Ireland, Hungary)."
    construction: "real_exp_raw / real_gdp_raw"
    units: "ratio"
    source: "OECD Economic Outlook; construction as in the replication code"
    coverage: "complete"
    kind: cont
  imp_share:
    label: "Real imports / real GDP"
    definition: "Imports of goods and services as a share of GDP, both in real terms. Can exceed 1 in re-export economies."
    construction: "real_imp_raw / real_gdp_raw"
    units: "ratio"
    source: "OECD Economic Outlook; construction as in the replication code"
    coverage: "complete"
    kind: cont
  labprod_growth:
    label: "Labour productivity growth, % per quarter"
    definition: "Quarter-on-quarter growth of real GDP per worker, in percent (not annualised)."
    construction: "100 × Δln(lab_prod_raw), computed on the full series from 1960, so 1995Q1 has a value"
    units: "percent per quarter"
    source: "OECD Economic Outlook; construction as in the replication code"
    coverage: "complete"
    kind: cont
  emp_pop:
    label: "Employment / working-age population"
    definition: "Total employment as a share of the working-age population (the employment rate)."
    construction: "tot_emp_pc_raw = tot_emp_raw / pop_quarterly"
    units: "ratio (0.62 = 62%)"
    source: "OECD Economic Outlook"
    coverage: "complete"
    kind: cont

  # ── brexit_analysis: treatment ────────────────────────────────────────────
  is_treated_unit:
    label: "Treated unit: 1 = United Kingdom (all quarters)"
    definition: "Marks the treated country in every quarter, before and after the referendum. Separates the UK from the 23 donors."
    construction: "country == 'United Kingdom'"
    units: "0/1"
    kind: dummy
    value_labels: {0: "Donor", 1: "United Kingdom"}
  treated:
    label: "Under treatment: 1 = UK from 2016Q3 onward"
    definition: "1 for the United Kingdom in the quarters after the headline treatment date (2016Q3–2020Q4, 18 rows), 0 otherwise, including the UK before 2016Q3. This is the 'under treatment now' convention that mlsynth expects in its treat field."
    construction: "is_treated_unit == 1 and t >= 87"
    units: "0/1"
    kind: dummy
    value_labels: {0: "Not treated", 1: "UK, 2016Q3 onward"}

  # ── brexit_panel_wide: sample flag and source series ──────────────────────
  in_estimation_sample:
    label: "1 = one of the 24 countries in brexit_analysis"
    definition: "Derived flag: 1 for the 24 countries kept in the estimation sample, 0 for the 12 dropped for incomplete data. Constant within a country."
    construction: "country is in brexit_analysis.csv (make_wide_panel.py)"
    units: "0/1"
    source: "This page (derived)"
    kind: dummy
    value_labels: {0: "Dropped", 1: "In the 24-country sample"}
  real_gdp:
    label: "Real GDP index, country's 1995 average = 1"
    definition: "Real GDP divided by its own 1995 average. ln(real_gdp) is log_rgdp."
    construction: "real_gdp_raw / mean of real_gdp_raw over 1995Q1–1995Q4"
    units: "index (1995 = 1)"
    source: "Born et al. (2019), from the OECD Economic Outlook"
    coverage: "30 countries"
    kind: cont
  real_gdp_raw:
    label: "Real GDP, national currency"
    definition: "Gross domestic product in volume terms."
    units: "national currency, real (volume) terms; base year and seasonal adjustment not documented in the source"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "30 countries"
    kind: cont
  real_con_raw:
    label: "Real private consumption, national currency"
    definition: "Private final consumption expenditure in volume terms."
    units: "national currency, real (volume) terms (as real_gdp_raw)"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "30 countries"
    kind: cont
  real_inv_raw:
    label: "Real investment, national currency"
    definition: "Investment in volume terms."
    units: "national currency, real (volume) terms (as real_gdp_raw)"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "30 countries"
    kind: cont
  real_exp_raw:
    label: "Real exports, national currency"
    definition: "Exports of goods and services in volume terms."
    units: "national currency, real (volume) terms (as real_gdp_raw)"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "30 countries"
    kind: cont
  real_imp_raw:
    label: "Real imports, national currency"
    definition: "Imports of goods and services in volume terms."
    units: "national currency, real (volume) terms (as real_gdp_raw)"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "30 countries"
    kind: cont
  real_gov_raw:
    label: "Real government consumption, national currency"
    definition: "Government final consumption expenditure in volume terms. Not used by the post or by the replication code."
    units: "national currency, real (volume) terms (as real_gdp_raw)"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "30 countries"
    kind: cont
  tot_emp_raw:
    label: "Total employment, persons"
    definition: "Number of people employed."
    units: "persons"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "32 countries"
    kind: cont
  tot_emp_pc_raw:
    label: "Employment / working-age population"
    definition: "Total employment as a share of the working-age population. Equals emp_pop in brexit_analysis."
    construction: "tot_emp_raw / pop_quarterly (exact identity in the data)"
    units: "ratio"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "32 countries"
    kind: cont
  lab_prod_raw:
    label: "Labour productivity: real GDP per worker"
    definition: "Real GDP per employed person. Its quarterly log change is labprod_growth."
    construction: "real_gdp_raw / tot_emp_raw (exact identity in the data)"
    units: "national currency per worker"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "28 countries"
    kind: cont
  unemp_rate_raw:
    label: "Unemployment rate (fraction)"
    definition: "Unemployed as a share of the labour force. Not used by the post."
    units: "fraction (0.05 = 5%)"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "31 countries"
    kind: cont
  pop_quarterly:
    label: "Working-age population, persons"
    definition: "Working-age population, the denominator of the employment rate. Identified by the exact identity tot_emp_pc_raw = tot_emp_raw / pop_quarterly and by the paper's definition of the employment share; the age bounds are not documented in the source."
    units: "persons"
    source: "OECD Economic Outlook (Nov 2018 vintage)"
    coverage: "36 countries"
    kind: cont
