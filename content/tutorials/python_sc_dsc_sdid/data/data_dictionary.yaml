# Data dictionary metadata for python_sc_dsc_sdid. This file drives build_data_dictionary.py.
# It draws on the post (index.md, sections 4 and 24), on r_sc_dsc_sdid/prepare_data.R and
# r_sc_dsc_sdid/data/README.md, on the replication code of de Brabander, Juodis and Miyazato
# Szini (2025), and on checks run directly on the data (every identity quoted below was
# verified to machine precision). Edit it and rerun:
#   cd content/tutorials/python_sc_dsc_sdid/data
#   python make_wide_panel.py          # only if the 36-country source panel changes
#   python build_data_dictionary.py
# Statistics on the page come from the CSVs at run time, and none are written here.
# The file contains no dollar sign, because one would pair into math on GitHub-rendered
# Markdown and expand as a global macro in Stata notes.

github_branch: master

study:
  title: "Brexit and the OECD: Quarterly GDP Panel"
  subtitle: "Data behind the synthetic control ladder in Python — 24 economies × 104 quarters (1995Q1–2020Q4) plus the full 36-country source panel"
  post_url: "https://carlos-mendez.org/tutorials/python_sc_dsc_sdid/"
  overview: >
    On 23 June 2016 the United Kingdom voted to leave the European Union. To estimate what
    the vote cost the British economy, the tutorial builds a "synthetic" United Kingdom: a
    weighted blend of other rich economies that tracks UK output quarter by quarter before
    the referendum. The gap between the real and the synthetic UK after the vote is the
    estimated effect. This page documents the two files behind that exercise.
    <code>brexit_analysis</code> is the estimation sample: quarterly real GDP and six
    economic covariates for 24 OECD economies from 1995Q1 to 2020Q4. The United Kingdom is
    the single treated unit and the other 23 countries are the donor pool. Every estimator in
    the post (difference-in-differences, synthetic control, demeaned synthetic control,
    synthetic difference-in-differences, MASC and augmented synthetic control) uses this
    file and only its outcome <code>log_rgdp</code> in the headline specification.
    <code>brexit_panel_wide</code> is the full source panel it was cut from: all 36 OECD
    countries from 1960Q1 to 2020Q4 and twelve underlying national-accounts and labour
    series, so that you can rebuild the donor pool, the window or the covariates yourself.
  panel_structure: >
    <strong>Key dates in <code>brexit_analysis</code>.</strong> The index <code>t</code> runs
    from 1 (1995Q1) to 104 (2020Q4). The headline specification dates the treatment at
    2016Q3 (<code>t</code> = 87), which leaves T0 = 86 pre-treatment quarters (1995Q1–2016Q2).
    The post evaluates the effect at two quarters: 2018Q4 (<code>t</code> = 96) and 2019Q4
    (<code>t</code> = 100). The robustness check that dates the treatment at 2016Q2 uses
    <code>t</code> = 86 as the first treated quarter. The referendum itself took place on
    23 June 2016, at the very end of 2016Q2.
    <br><br><strong>Observed versus projected quarters.</strong> Both files come from the
    November 2018 vintage of the OECD Economic Outlook. The data are observed through 2018Q3
    and are OECD projections from 2018Q4 to 2020Q4 (see Known limitations). Both evaluation
    quarters of the post therefore fall in the projected part of the file.
  kpis:
    - {n: 24, l: "countries (1 treated, 23 donors)"}
    - {n: 104, l: "quarters, 1995Q1–2020Q4"}
    - {n: 86, l: "pre-treatment quarters (T0)"}
    - {n: 36, l: "countries in the source panel"}

dta_format_version: 118

sources:
  - name: "OECD Economic Outlook, November 2018 vintage"
    provides: "The quarterly national accounts (GDP, consumption, investment, government spending, exports, imports), employment, unemployment and working-age population for 36 OECD countries. The vintage contains outturns through 2018Q3 and OECD projections through 2020Q4."
    reference: "OECD Economic Outlook database. https://www.oecd.org/economic-outlook/"
  - name: "Born, Müller, Schularick and Sedláček (2019)"
    provides: "Assembled the panel from the Economic Outlook, normalised GDP to its 1995 average, and defined the 23-country donor pool used for Brexit."
    reference: "The Economic Journal, 129(623), 2722–2744. https://doi.org/10.1093/ej/uez020"
  - name: "de Brabander, Juodis and Miyazato Szini (2025), replication package"
    provides: "Redistributes the panel as the MATLAB file brexit_data_raw_eo_nov2018.mat and contains the R code whose covariate construction these files follow."
    reference: "Econometric Reviews, 44(10), 1617–1646. https://doi.org/10.1080/07474938.2025.2530649"
  - name: "R edition of this tutorial (prepare_data.R)"
    provides: "Converts the MATLAB file into brexit_analysis.csv and the long-format brexit_panel_long.csv. The wide panel on this page is a lossless pivot of that long file (make_wide_panel.py in this folder)."
    reference: "https://carlos-mendez.org/tutorials/r_sc_dsc_sdid/"

formulas_html: |
  <h3>The outcome</h3>
  <ul class="tight">
    <li><strong><code>log_rgdp</code></strong> = ln(<code>real_gdp</code>), where <code>real_gdp</code> = <code>real_gdp_raw</code> ÷ (average of <code>real_gdp_raw</code> over 1995Q1–1995Q4) for each country. So every country averages exp(<code>log_rgdp</code>) = 1 in 1995, and <code>log_rgdp</code> ≈ the cumulative growth since 1995 (0.44 for the UK in 2016Q2 means about 56% more output than in 1995).</li>
    <li><strong>Why the indexing matters.</strong> Dividing by a country-specific constant shifts that country's log series up or down by a constant. Estimators with an intercept or demeaning (DiD, demeaned SC, SDID) are unaffected. Plain synthetic control, which has no intercept, must match the UK's level with a convex blend of donor levels, so the choice of base year changes which donors it can use.</li>
    <li><strong>The effect.</strong> The post's estimand at quarter <em>t</em> is τ<sub>t</sub> = Y<sub>UK,t</sub>(1) − Y<sub>UK,t</sub>(0), the average treatment effect on the treated at a single quarter, estimated as <code>log_rgdp</code> of the UK minus the synthetic counterfactual. It reports −100·τ<sub>t</sub>, the percentage shortfall of GDP.</li>
  </ul>
  <h3>The six covariates (as built in the replication code)</h3>
  <ul class="tight">
    <li><strong>Expenditure shares</strong>: <code>cons_share</code> = <code>real_con_raw</code> ÷ <code>real_gdp_raw</code>, and likewise <code>inv_share</code>, <code>exp_share</code>, <code>imp_share</code> with investment, exports and imports. Ratios of real (volume) series, not of nominal values.</li>
    <li><strong><code>labprod_growth</code></strong> = 100 × [ln(<code>lab_prod_raw</code><sub>t</sub>) − ln(<code>lab_prod_raw</code><sub>t−1</sub>)], quarterly growth of GDP per worker in percent. It is computed on the full series from 1960, so 1995Q1 uses 1994Q4 and has no missing value.</li>
    <li><strong><code>emp_pop</code></strong> = <code>tot_emp_pc_raw</code> = <code>tot_emp_raw</code> ÷ <code>pop_quarterly</code>, employment as a share of the working-age population.</li>
  </ul>
  <h3>Identities in the source panel</h3>
  <ul class="tight">
    <li><code>lab_prod_raw</code> = <code>real_gdp_raw</code> ÷ <code>tot_emp_raw</code> (exact in every cell where all three exist).</li>
    <li><code>tot_emp_pc_raw</code> = <code>tot_emp_raw</code> ÷ <code>pop_quarterly</code> (exact), which identifies <code>pop_quarterly</code> as the working-age population.</li>
  </ul>
  <h3>Treatment indicators</h3>
  <ul class="tight">
    <li><code>is_treated_unit</code> = 1 for the United Kingdom in every quarter ("ever treated").</li>
    <li><code>treated</code> = 1 for the United Kingdom from 2016Q3 (<code>t</code> ≥ 87) onward ("under treatment now"), 18 rows in all.</li>
    <li>The post does not use <code>treated</code> directly. Its helper <code>window()</code> keeps the 86 pre-treatment quarters plus one evaluation quarter, renumbers time as <code>tt</code> = 1…87, and rebuilds <code>treat</code> = 1 for the UK at <code>tt</code> = 87. That turns mlsynth's "average over all post periods" into the effect at a single quarter.</li>
  </ul>
  <h3>From the source panel to the estimation sample</h3>
  <ul class="tight">
    <li>Keep the 24 countries with <code>in_estimation_sample</code> = 1 and the quarters 1995Q1–2020Q4, then apply the formulas above. <code>make_wide_panel.py</code> checks that ln(<code>real_gdp</code>) reproduces <code>log_rgdp</code> to within 1e-9 (the long file is rounded to 10 significant digits).</li>
  </ul>

caveats:
  - "<strong>The last nine quarters are OECD projections, not data.</strong> The panel is the November 2018 vintage of the OECD Economic Outlook, so it contains observed values only through 2018Q3. From 2018Q4 to 2020Q4 every series is the OECD's projection. The data show it plainly: the average absolute quarter-to-quarter change in GDP growth falls from 0.77 points (2010–2018Q2) to 0.06 points (2019–2020), and 2020 shows no COVID-19 collapse. Both evaluation quarters of the post (2018Q4 and 2019Q4) are therefore projected, so the estimated 'shortfall' compares projected UK output with projected donor output. This inference is drawn from the data; the source file does not flag projected values."
  - "<strong><code>log_rgdp</code> is not the log of GDP in currency units.</strong> It is the log of GDP indexed to each country's 1995 average, so values start near 0 in 1995 and measure growth since then. Comparing levels across countries is meaningless; comparing paths is the point."
  - "<strong><code>treated</code> hard-codes one treatment date.</strong> It switches on at 2016Q3. The 2016Q2 robustness check and every evaluation window in the post build their own indicator instead (<code>treat</code> in <code>window()</code>)."
  - "<strong>Trade shares above 1 are real, not errors.</strong> Luxembourg (exports up to 2.18 times GDP), Ireland and Hungary re-export much of what they import, so exports and imports can exceed GDP. Ireland's labour productivity growth of 19.6% in 2015Q1 reflects the relocation of multinational assets, not a real productivity boom."
  - "<strong>The donor pool is itself a choice.</strong> Twelve of the 36 countries are dropped because at least one stored series is incomplete: Chile, Czech Republic, Denmark, Estonia, Greece, Israel, Latvia, Lithuania, Mexico, Poland, Slovenia and Turkey. Czech Republic, Estonia and Israel are dropped only for a gap in an inflation series that no specification uses."
  - "<strong>The paper's text and its code differ.</strong> de Brabander et al. (2025) write that all variables are standardised and log-transformed; their replication code (and these files) use log(<code>real_gdp</code>) for the outcome and untransformed shares, growth rates and ratios for the covariates."
  - "<strong>Units of the raw series are not documented.</strong> The <code>_raw</code> volume series are in national currency (or persons), at the prices and base year of the OECD Economic Outlook; the source file records neither the base year nor whether series are seasonally adjusted. Magnitudes are consistent with annualised quarterly levels (UK <code>real_gdp_raw</code> in 2016Q2 is 1.96 trillion pounds)."
  - "<strong>Coverage before 1995 is uneven.</strong> In the wide panel, GDP and its components exist for 30 of the 36 countries, employment for 32, labour productivity for 28, unemployment for 31 and the working-age population for all 36. Several series start after 1960 (Lithuania's labour series in 2002Q1). Empty cells mean the source has no value."

