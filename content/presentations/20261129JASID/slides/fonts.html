<!-- Bundled webfonts, declared here rather than in theme.scss ON PURPOSE.

     Quarto compiles theme.scss to
       <deck>_files/libs/revealjs/dist/theme/quarto-<hash>.css
     and a relative url() inside a stylesheet resolves against THE STYLESHEET, not the document.
     So `url("fonts/Inter-Variable.ttf")` written in theme.scss would resolve to
       .../dist/theme/fonts/Inter-Variable.ttf
     which 404s — and worse, that directory really exists (reveal.js ships source-sans-pro and
     league-gothic there), so the failure looks like a working path and the deck silently falls back
     to a system font. That is exactly the bug this deck already had: theme.scss asked for
     "Source Sans Pro", which is not installed on the author's machine, and nobody noticed.

     Declared in the document head, url() resolves against the HTML file, so `fonts/...` is correct
     and stays correct.

     All three faces are variable fonts (one file, full 100-900 weight axis) under the SIL Open Font
     License; the licences ship beside them in fonts/.

     ONE src PER FACE, and that is deliberate too. Each @font-face used to list the same file
     twice — once as format("truetype-variations") for browsers that understand variable fonts,
     once as format("truetype") for those that do not. Under `embed-resources: true` pandoc
     base64-inlines every url() it finds, so each font was embedded TWICE and the single-file
     deck carried 2.8 MB of pure duplicate. The fallback also bought nothing worth that: every
     browser that can run reveal.js has supported variable fonts since 2017-18 (Chrome 62,
     Firefox 62, Safari 11, Edge 17), and a browser old enough to skip this src simply falls
     through to the system stack in theme.scss ($font-family-sans-serif / $title-serif), which
     degrades gracefully rather than breaking. Do not re-add the second url(). -->
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-Variable.ttf") format("truetype-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Source Serif 4";
    src: url("fonts/SourceSerif4-Variable.ttf") format("truetype-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  /* Fira Code: used only for the website line on the cover and the closing card. */
  @font-face {
    font-family: "Fira Code";
    src: url("fonts/FiraCode-Variable.ttf") format("truetype-variations");
    font-weight: 300 700;
    font-style: normal;
    font-display: block;
  }
</style>
