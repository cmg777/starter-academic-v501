# Data dictionary metadata for python_sc101. This file drives build_data_dictionary.py.
# It follows the write-data-dictionary skill and draws on the post (index.md), on
# execution_log.txt, on the labels of the original .dta file, and on Section 3.2, Table 1,
# and Appendix A of Abadie, Diamond, and Hainmueller (2010). Edit it and rerun the renderer:
#   cd content/post/python_sc101/data && python build_data_dictionary.py
# Statistics on the page come from smoking_sc.csv at run time, and none are written here.
# The file contains no dollar sign, because one would pair into math on GitHub-rendered
# Markdown and expand as a global macro in Stata notes.
#
# Local renderer patch: build_data_dictionary.py is the python_did101 copy, with its
# empty-cell placeholders changed from dashes (an em dash in the statistics tables and an en
# dash for the sparklines) to "n/a". The docstring of the renderer lists this patch together
# with the small style fixes that bring its comments and generated text under the writing
# rules of the post.

# Raw-GitHub download links must point at the branch from which the site deploys.
github_branch: master

study:
  title: "Proposition 99 and cigarette sales in 39 US states (synthetic control tutorial)"
  subtitle: "This panel of Abadie, Diamond, and Hainmueller (2010) records cigarette sales and four covariates for 1970–2000. It supplies the data behind every estimate in the Python synthetic control tutorial."
  overview: >
    Proposition 99 raised the cigarette tax in California by 25 cents per pack from January
    1989 and funded anti-smoking education. Abadie, Diamond, and Hainmueller (2010), hereafter
    ADH (2010), evaluate it with a panel of 39 US states from 1970 to 2000. Each row is one
    state in one year, so the panel has 1,209 rows. California is the treated state, and the
    other 38 states form the donor pool. The outcome <code>cigsale</code> measures cigarette
    sales per capita, in packs. Four covariates describe each state: log GDP per capita, the
    share of the population aged 15–24, the retail price of cigarettes, and beer consumption
    per capita. The Python tutorial builds a synthetic California from these variables. It
    estimates that the program reduced sales by 18.98 packs per capita per year over 1989–2000.
  panel_structure: >
    <strong>One balanced panel.</strong> The file <code>smoking_sc</code> has 39 states × 31
    years = 1,209 rows, keyed by <code>state</code> × <code>year</code> and sorted by state and
    year. The sample omits four states that began large tobacco control programs in
    1989–2000 (Arizona, Florida, Massachusetts, and Oregon). It also omits seven states that
    raised cigarette taxes by 50 cents or more over the same period, as well as the District
    of Columbia (Section 3.2 of ADH 2010). The original Stata file stores
    <code>state</code> as a numeric code with value labels in alphabetical order, so California
    has code 3. The CSV copy stores the state name as text instead, and so does the
    <code>.dta</code> file generated from it in this folder.
  kpis:
    - {n: 39, l: "states (1 treated, 38 donors)"}
    - {n: 31, l: "years, 1970–2000"}
    - {n: "1,209", l: "state-year rows"}
    - {n: "−18.98", l: "ATT in packs per capita per year"}

dta_format_version: 118

sources:
  - name: "Abadie, Diamond, and Hainmueller (2010)"
    provides: "The case study and the state panel. Appendix A names the original sources: Orzechowski and Walker (2005) for sales and prices, the Bureau of the Census for income and the age share, and the Beer Institute for beer consumption."
    reference: "Journal of the American Statistical Association, 105(490), 493–505. https://doi.org/10.1198/jasa.2009.ap08746"
  - name: "QuaRCS-lab data-open"
    provides: "The original Stata file smoking_sc.dta, labeled Tobacco Sales in 39 US States, which the post and its Stata edition load"
    reference: "https://github.com/quarcs-lab/data-open/raw/master/isds/smoking_sc.dta"
  - name: "This post (CSV copy)"
    provides: "smoking_sc.csv, with the state name as text and the values of the original .dta file at full double precision (89.8 appears as 89.80000305175781). The post loads this copy first and falls back to the original file online."
    reference: "Mendez, C. (2026). https://carlos-mendez.org/post/python_sc101/"

formulas_html: |
  <h3>How the post builds the predictors</h3>
  <ul class="tight">
    <li><strong>Covariate averages.</strong> For each state, the post averages <code>lnincome</code>, <code>age15to24</code>, <code>retprice</code>, and <code>beer</code> over 1980–1988. Missing years drop out of each average, so the <code>beer</code> average rests on 1984–1988 alone.</li>
    <li><strong>Lagged sales.</strong> The columns <code>cigsale_1988</code>, <code>cigsale_1980</code>, and <code>cigsale_1975</code> repeat the sales of each state in that year in every row of the state. Each one enters the fit as a predictor with its own one-year window.</li>
    <li><strong>Treatment indicator.</strong> The column <code>treated</code> equals 1 for California in 1989–2000, which gives 12 rows, and 0 otherwise.</li>
  </ul>
  <h3>What the post estimates from this file</h3>
  <ul class="tight">
    <li><strong>Synthetic California.</strong> It is a weighted average of donor sales, with nonnegative weights that sum to one. Five states receive positive weight: Utah (0.335), Nevada (0.236), Montana (0.202), Colorado (0.160), and Connecticut (0.068).</li>
    <li><strong>Gap and ATT.</strong> The gap in a year is actual sales in California minus synthetic sales. The average treatment effect on the treated (ATT) is the mean gap over 1989–2000, −18.98 packs per capita per year.</li>
    <li><strong>Pre-treatment fit.</strong> The root mean squared error of the gaps over 1970–1988 is 1.754 packs per capita.</li>
  </ul>

caveats:
  - "<strong>The variable <code>lnincome</code> measures GDP, not income.</strong> Despite its name, <code>lnincome</code> is the log of GDP per capita, according to the original label and Table 1 of ADH (2010). The text and Appendix A of the same paper call it per capita state personal income (logged), so the source itself uses both descriptions."
  - "<strong>The variable <code>age15to24</code> is a share, not a percent.</strong> Its values lie between 0.129 and 0.204, although the original label reads percent. Multiply it by 100 to compare it with the percentages in Table 1 of ADH (2010)."
  - "<strong>Covariate coverage is incomplete.</strong> The variable <code>lnincome</code> covers 1972–1997, <code>beer</code> covers 1984–1997, and <code>age15to24</code> covers 1970–1990. The <code>beer</code> average over 1980–1988 therefore rests on 1984–1988 alone. A fake start in 1984 leaves no beer data in its window of 1980–1983, so that in-time placebo fails in the post."
  - "<strong>State coding differs across files.</strong> The original .dta file stores <code>state</code> as a numeric code with value labels, and the CSV and the <code>.dta</code> file generated here store the state name as text. In Stata, <code>encode state, generate(state_id)</code> restores the original codes, because <code>encode</code> numbers the names in alphabetical order. California then has code 3, as in the original file."
  - "<strong>Read the CSV at full precision.</strong> The original file stores every number in single precision, and the CSV writes these exact values as doubles. Some parsers miss the last digits. The default parser of pandas 3.0.1 changes 1,422 of the 4,797 numeric values, and <code>readr::read_csv</code> 2.1.6 changes 771, each by less than 1e-13. The pandas option <code>float_precision=\"round_trip\"</code> recovers the exact values, and <code>load_data()</code> in the post uses it. The functions <code>read.csv</code> in base R and <code>import delimited</code> in Stata 19 also read them exactly."
  - "<strong>The generated .dta file stores doubles.</strong> The renderer writes every number through pyreadstat as a double, including <code>year</code>, whereas the original file stores floats. The values themselves are identical to those of the original file. In Stata, <code>recast float cigsale lnincome beer age15to24 retprice</code> restores the original storage type without changing any value."
  - "<strong>Sales come from tax records.</strong> Cigarette sales per capita rest on state tax revenues rather than on surveys of smoking. ADH (2010) note that smuggling across tax jurisdictions affects such data (Section 3.2)."
  - "<strong>A second tax increase in 1999.</strong> Proposition 10 raised the cigarette tax in California by a further 50 cents per pack in January 1999. Sales in California in 1999 and 2000 therefore reflect both measures."

citation:
  author: "Mendez, Carlos"
  year: "2026"
  extra_apa: "Abadie, A., Diamond, A., & Hainmueller, J. (2010). Synthetic control methods for comparative case studies: Estimating the effect of California's tobacco control program. Journal of the American Statistical Association, 105(490), 493–505. https://doi.org/10.1198/jasa.2009.ap08746"  # style-allow: cited title, verbatim
  extra_bibtex: "@article{abadie2010synthetic,\n  author  = {Abadie, Alberto and Diamond, Alexis and Hainmueller, Jens},\n  title   = {Synthetic Control Methods for Comparative Case Studies: Estimating the Effect of {California's} Tobacco Control Program},\n  journal = {Journal of the American Statistical Association},\n  volume  = {105}, number = {490}, pages = {493--505}, year = {2010},\n  doi     = {10.1198/jasa.2009.ap08746}\n}"  # style-allow: cited title, verbatim

files:
  smoking_sc.csv:
    label: "Cigarette sales and covariates: 39 US states × 31 years (1970–2000)"
    grain: "state × year (balanced panel)"
    years: "1970–2000 (31 years)"
    coverage: "39 US states (California and 38 donor states)"
    key: "state × year"
    purpose: "The post uses this file for every estimate: the baseline fit, the placebo tests, the leave-one-out refits, and the estimator tour."
    note: "State panel of Abadie, Diamond, and Hainmueller (2010), from quarcs-lab/data-open (isds/smoking_sc.dta). California adopts Proposition 99 in 1989, and the other 38 states form the donor pool. This file stores the state name as text, while the original file stores a labeled numeric code with California = 3."

columns:
  state:
    label: "State name (39 US states)"
    definition: "Name of the US state. California is the treated state, and the other 38 states form the donor pool."
    construction: "The original .dta file stores a numeric code with value labels in alphabetical order (1 = Alabama, 3 = California, 39 = Wyoming). The CSV keeps the label text."
    source: "ADH (2010), via quarcs-lab/data-open"
    coverage: "39 states in every year"
    kind: str
  year:
    label: "Year (1970–2000)"
    definition: "Calendar year of the observation. Proposition 99 takes effect in 1989, so 1970–1988 is the pre-treatment period and 1989–2000 the post-treatment period."
    construction: "Stored as a float in the original .dta file and as an integer in the CSV."
    units: "calendar year"
    source: "ADH (2010), via quarcs-lab/data-open"
    coverage: "31 years for every state"
    kind: year
  cigsale:
    label: "Cigarette sales per capita, in packs (outcome)"
    definition: "Annual cigarette sales per capita, in packs, and the outcome of the analysis. The series divides the tax-paid sales of cigarette packs in a state by its population (Appendix A of ADH 2010)."
    construction: "Original .dta label: cigarette sale per capita (in packs). The post compares California with its synthetic control on this variable in every year."
    units: "packs per capita (annual)"
    source: "Orzechowski and Walker (2005), via ADH (2010) and quarcs-lab/data-open"
    coverage: "1970–2000, all 1,209 rows"
    kind: cont
  lnincome:
    label: "Log of state GDP per capita (covariate)"
    definition: "Natural logarithm of GDP per capita in the state, as the original .dta label and Table 1 of ADH (2010) describe it. The text and Appendix A of ADH (2010) call it per capita state personal income (logged), converted to 1997 dollars with the Consumer Price Index."
    construction: "Original .dta label: log state per capita gdp. The post averages it over 1980–1988 as a predictor."
    units: "log of 1997 dollars per person"
    source: "Bureau of the Census, United States Statistical Abstract, via ADH (2010) and quarcs-lab/data-open"
    coverage: "1972–1997 (1,014 of 1,209 rows)"
    kind: cont
  beer:
    label: "Beer consumption per capita, in gallons (covariate)"
    definition: "Per capita consumption of malt beverages, in gallons. The data start in 1984, so the 1980–1988 average in the post rests on 1984–1988 alone."
    construction: "Original .dta label: beer consumption per capita. ADH (2010) also average it over 1984–1988 (notes to Table 1)."
    units: "gallons per capita"
    source: "Beer Institute, via ADH (2010) and quarcs-lab/data-open"
    coverage: "1984–1997 (546 of 1,209 rows)"
    kind: cont
  age15to24:
    label: "Share of the population aged 15–24, a fraction (covariate)"
    definition: "Share of the state population aged 15 to 24, stored as a fraction between 0.129 and 0.204 (mean 0.175). The original label calls it a percent, and Table 1 of ADH (2010) reports it in percent, so multiply it by 100 to compare."
    construction: "Original .dta label: percent of state population aged 15-24 years. The post averages it over 1980–1988 as a predictor."
    units: "fraction (0–1)"
    source: "US Census Bureau, via ADH (2010) and quarcs-lab/data-open"
    coverage: "1970–1990 (819 of 1,209 rows)"
    kind: cont
  retprice:
    label: "Retail price of cigarettes, in cents per pack (covariate)"
    definition: "Average retail price of a pack of cigarettes, in cents, including state sales taxes where applicable. Appendix A of ADH (2010) converts income to 1997 dollars but mentions no such conversion for this price."
    construction: "Original .dta label: retail price of cigarettes. The post averages it over 1980–1988 as a predictor."
    units: "cents per pack"
    source: "Orzechowski and Walker (2005), via ADH (2010) and quarcs-lab/data-open"
    coverage: "1970–2000, all 1,209 rows"
    kind: cont
