# Data dictionary metadata for python_did101 — drives build_data_dictionary.py.
# Written for the write-data-dictionary skill from the post's text, script.py and
# execution_log.txt (the source of truth for every number quoted below); edit and rerun:
#   cd content/post/python_did101/data && python build_data_dictionary.py
# Statistics on the page are computed live from the two CSVs, never written here.
# No dollar sign anywhere in this file (it would pair into math on GitHub-rendered Markdown
# and expand as a global macro in Stata notes).

# Raw-GitHub download links must point at the branch the site deploys from.
github_branch: master

study:
  title: "Tutoring and GPA in 35 high schools (DiD tutorial)"
  subtitle: "A simulated school panel in which 10 of 35 high schools adopt an after-school tutoring program at the same time: the data behind every number in the Python Difference-in-Differences tutorial, as a 2×2 file and an 8-period event-study file."
  overview: >
    Companion data for the tutorial <em>Introduction to Difference-in-Differences (DiD) in
    Python</em>, which uses the simulated case study of Corral and Yang (2024). In one region,
    <strong>10 of 35 high schools</strong> adopt an after-school tutoring program for low-income
    students at the same time; the other 25 schools never adopt it. The outcome <code>gpa</code> is
    the school's average GPA of low-income students. In the 2×2 file, treated schools rise from
    60.17 to 96.37 (a naive change of 36.20 points) while comparison schools rise from 71.22 to
    82.10 (10.89 points), so the DiD estimate of the average treatment effect on the treated (ATT)
    is <strong>25.315</strong> GPA points (25.32 from the rounded means). The event-study file
    follows the same 35 schools for 8 periods with adoption in period 5; its event-time
    coefficients are 0.34, &minus;0.32 and 0.59 before adoption and 25.03 to 25.70 after.
  panel_structure: >
    <strong>Two files, two separate simulations.</strong> <code>tutoring_did</code> is the 2×2
    design: 35 schools × 2 periods = 70 rows, keyed by <code>id</code> × <code>time</code>
    (<code>time</code> 1 = before, 2 = after the program). <code>tutoring_didevent</code> is the
    event-study panel: the same 35 school ids × 8 periods = 280 rows, keyed by <code>id</code> ×
    <code>time</code>, with treatment from period 5 on. Both panels are strongly balanced and the
    treated schools are <code>id</code> 26&ndash;35 in both. The 2×2 file is <em>not</em> two
    periods of the event-study file: its GPA values do not appear in it, which is why collapsing
    the event study to a 2×2 (Exercise 2 in the post) gives 24.90 rather than 25.32.
  kpis:
    - {n: 2, l: "datasets"}
    - {n: 35, l: "schools"}
    - {n: 10, l: "treated schools"}
    - {n: "25.32", l: "DiD estimate (GPA points)"}

dta_format_version: 118

sources:
  - name: "Corral and Yang (2024)"
    provides: "The simulated tutoring case study: 35 high schools, 10 adopting an after-school tutoring program, GPA of low-income students, the 2×2 and event-study designs"
    reference: "Corral, D., & Yang, M. (2024). An introduction to the difference-in-differences design in education policy research. Asia Pacific Education Review, 25(3), 663–672. https://doi.org/10.1007/s12564-024-09959-0"
  - name: "QuaRCS-lab data-open"
    provides: "The original Stata files tutoring_did.dta and tutoring_didevent.dta that the post loads"
    reference: "https://github.com/quarcs-lab/data-open/tree/master/isds"
  - name: "This post (CSV copies)"
    provides: "tutoring_did.csv and tutoring_didevent.csv: the same values as the original .dta files, written at full precision so Python, R and Stata read identical numbers (used by the cheat sheets and analysis.do)"
    reference: "Mendez, C. (2026). https://carlos-mendez.org/post/python_did101/"

formulas_html: |
  <h3>Design variables</h3>
  <ul class="tight">
    <li><code>treated</code> = 1 for the 10 schools that adopt the program (<code>id</code> 26–35), 0 for the 25 comparison schools. Fixed within school.</li>
    <li><code>post</code> = 1 after adoption: <code>time</code> = 2 in the 2×2 file; <code>time</code> ≥ 5 in the event-study file.</li>
    <li><code>txp</code> = <code>treated</code> × <code>post</code>: the DiD treatment indicator (1 for a treated school in a treated period).</li>
    <li><code>timeToTreat</code> = <code>time</code> − 5 for treated schools (−4, …, 3; 0 = first treated period); missing for comparison schools, which are never treated.</li>
  </ul>
  <h3>Estimates the post computes from these files</h3>
  <ul class="tight">
    <li>2×2 DiD: (mean treated post − mean treated pre) − (mean comparison post − mean comparison pre) = 36.20 − 10.886 = <strong>25.315</strong> (25.32 from means rounded to two decimals).</li>
    <li>Two-way fixed effects: <code>gpa ~ txp | id + time</code>, standard errors clustered by school: 25.315 (SE 0.585).</li>
    <li>Event study: <code>gpa ~ i(timeToTreat, ref = -1) | id + time</code> on the 280-row file, with comparison schools' missing <code>timeToTreat</code> replaced by a placeholder so they stay in the sample.</li>
  </ul>

caveats:
  - "<strong>Simulated, not observed.</strong> The schools come from the teaching example of Corral and Yang (2024), built to illustrate DiD mechanics. The R² near 0.99 and a 25-point effect on GPA are far larger than real tutoring programs produce."
  - "<strong>GPA can exceed 100.</strong> <code>gpa</code> is described as a 0–100 score, but the simulated event-study values reach 107.68 (the 2×2 file stays below 100, maximum 99.15). Treat it as a continuous score, not a bounded grade."
  - "<strong>timeToTreat is missing by design</strong> for the 25 comparison schools. Software that drops rows with missing values (pyfixest, fixest, Stata's <code>i.</code> operator) silently removes every comparison school; fill it with a placeholder or build the event dummies by hand."
  - "<strong>Two independent simulations.</strong> The 2×2 file is not periods 4 and 5 of the event-study file, so estimates from the two files differ (25.315 vs. a collapsed 24.897)."
  - "<strong>female_share varies within schools over time.</strong> It is a time-varying covariate; the post uses it only as a robustness check (it moves the DiD estimate by 0.013)."
  - "<strong>CSV values carry full float precision.</strong> The original .dta files store <code>gpa</code> and <code>female_share</code> as single-precision floats; the CSVs write those exact values as doubles (17 significant digits). In Stata, read the CSV with <code>import delimited …, asdouble</code>."

