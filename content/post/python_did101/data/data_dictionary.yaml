files:
  tutoring_did.csv:
    label: "Tutoring and GPA, 2x2 DiD panel: 35 schools x 2 periods"
    grain: "school x period (balanced panel)"
    years: "2 periods (before, after)"
    coverage: "35 high schools (10 treated, 25 comparison) x 2 periods = 70 rows"
    key: "id x time"
    purpose: "Input for the post's 2x2 analysis: naive before-after comparison, manual double difference, OLS interaction, two-way fixed effects, the covariate check and the four standard-error types."
    note: "Simulated teaching data (Corral and Yang 2024), from quarcs-lab/data-open isds/tutoring_did.dta. Treated schools are id 26-35. time 1 = before, 2 = after the program; post = time == 2; txp = treated x post."

  tutoring_didevent.csv:
    label: "Tutoring and GPA, event-study panel: 35 schools x 8 periods"
    grain: "school x period (balanced panel)"
    years: "8 periods; adoption in period 5"
    coverage: "35 high schools (10 treated, 25 comparison) x 8 periods = 280 rows"
    key: "id x time"
    purpose: "Input for the post's event study: one coefficient per period relative to adoption (t = -4 ... 3, reference t = -1)."
    note: "Simulated teaching data (Corral and Yang 2024), from quarcs-lab/data-open isds/tutoring_didevent.dta. A separate simulation from the 2x2 file. post = time >= 5; timeToTreat = time - 5 for treated schools and missing for comparison schools."

columns:
  id:
    label: "School identifier (1-35)"
    definition: "High-school identifier, 1 to 35. Schools 26-35 adopt the tutoring program."
    construction: "As provided in the original .dta files."
    units: "id"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "35 schools"
    kind: id
  time:
    label: "Period (2x2: 1-2; event study: 1-8)"
    definition: "Time period. In the 2x2 file, 1 = before and 2 = after the program; in the event-study file, periods 1-8 with adoption at the start of period 5."
    construction: "As provided in the original .dta files."
    units: "period"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "all rows"
    kind: cont
  treated:
    label: "Treatment group: school adopts tutoring (1 = yes)"
    definition: "1 for the 10 schools that adopt the after-school tutoring program, 0 for the 25 comparison schools. Constant within school."
    construction: "1 if id is 26-35."
    units: "0/1"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "all rows"
    kind: dummy
    value_labels: {0: "Comparison school", 1: "Treated school"}
  post:
    label: "Post-adoption period (1 = yes)"
    definition: "1 in periods after the program starts: time = 2 in the 2x2 file, time >= 5 in the event-study file."
    construction: "post = (time == 2) in the 2x2 file; post = (time >= 5) in the event-study file."
    units: "0/1"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "all rows"
    kind: dummy
    value_labels: {0: "Before", 1: "After"}
  txp:
    label: "Treated x post: school is under the program (1 = yes)"
    definition: "The DiD treatment indicator: 1 for a treated school in a post-adoption period. Its coefficient in the regressions is the DiD estimate."
    construction: "txp = treated x post."
    units: "0/1"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "all rows"
    kind: dummy
    value_labels: {0: "Not under the program", 1: "Under the program"}
  gpa:
    label: "Average GPA of low-income students (outcome)"
    definition: "The outcome: the school's average GPA of low-income students, described as a 0-100 score (simulated values reach 107.68 in the event-study file)."
    construction: "Simulated by Corral and Yang (2024); stored as single-precision float in the original .dta, written at full precision in the CSV."
    units: "GPA points"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "all rows"
    kind: cont
  female_share:
    label: "Share of female students (covariate)"
    definition: "Share of female students in the school, between 0 and 1. Varies within schools over time; used as a robustness covariate."
    construction: "Simulated by Corral and Yang (2024); single-precision float in the original .dta."
    units: "share (0-1)"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "all rows"
    kind: cont
  timeToTreat:
    label: "Periods relative to adoption (treated schools only)"
    definition: "Event time for treated schools: time - 5, from -4 to 3 (0 = first treated period, -1 = the reference period in the post). Missing for comparison schools, which are never treated."
    construction: "timeToTreat = time - 5 if treated == 1; missing otherwise."
    units: "periods"
    source: "Corral and Yang (2024), via quarcs-lab/data-open"
    coverage: "80 of 280 rows (treated schools)"
    kind: cont
