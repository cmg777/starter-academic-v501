# Data dictionary metadata for python_fwl — drives build_data_dictionary.py.
# Generated by the write-data-dictionary skill from the post's text, script.py and
# fwl_results.json (the single source of truth for every number quoted below); edit and rerun:
#   cd content/post/python_fwl/data && ../../../../.venv/bin/python build_data_dictionary.py
# Statistics on the page are computed live from fwl_store_data.csv, never written here.
# Currency: write "US dollars" in words — no dollar sign anywhere in this file (it would
# pair into math on GitHub-rendered Markdown and expand as a global macro in Stata notes).

# Raw-GitHub download links must point at the branch the site deploys from, not the
# feature branch the renderer happens to run on.
github_branch: master

study:
  title: "Simulated retail stores (FWL tutorial)"
  subtitle: "Fifty simulated stores in which neighborhood income confounds the effect of coupons on daily sales — the dataset behind every number in the Python FWL tutorial."
  overview: >
    Companion data for the tutorial <em>The FWL Theorem: Making Multivariate Regressions
    Intuitive</em>, inspired by Courthoud (2022). The file holds <strong>50 simulated stores</strong>
    built so that the answer is known in advance: coupons raise daily sales by exactly
    <strong>+0.2</strong>, but neighborhood income lowers coupon usage and raises sales, so it
    confounds the comparison. Ignoring income, the slope of sales on coupons is &minus;0.1059
    (p = 0.365); controlling for income it becomes +0.2673 (p = 0.031), and the
    <strong>Frisch&ndash;Waugh&ndash;Lovell (FWL) theorem</strong> recovers the same +0.2673 from a
    regression of residualized sales on residualized coupons.
  panel_structure: >
    <strong>One file, one row per store.</strong> <code>fwl_store_data</code> is a cross-section of
    50 simulated stores with four numeric columns (<code>sales</code>, <code>coupons</code>,
    <code>income</code>, <code>dayofweek</code>) and no missing values. There is no store
    identifier: rows are in the order the stores were drawn. The file is written by the post's
    <code>script.py</code> (numpy <code>default_rng(42)</code>) and is the exact input for every
    estimate in the post, the slides and the web app.
  kpis:
    - {n: 1, l: "dataset"}
    - {n: 4, l: "variables"}
    - {n: 50, l: "stores"}
    - {n: "+0.2", l: "true coupon effect"}

dta_format_version: 118

