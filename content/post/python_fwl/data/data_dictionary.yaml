files:
  fwl_store_data.csv:
    label: "Simulated restaurants, January: sales, coupons, income, day of week"
    grain: "restaurant (cross-section, January)"
    coverage: "50 simulated restaurants"
    key: "row order (no id column; row i is restaurant_id i in the panel)"
    purpose: "Input for every estimate in the main body of the post: naive vs. full OLS, FWL residualization, the OVB identity and the two-control extension."
    note: "Simulated by script.py with numpy default_rng(42) (PCG64): income ~ N(50, 10); dayofweek uniform on 1-7; coupons = 60 - 0.5 x income + N(0, 5); sales = 10 + 0.2 x coupons + 0.3 x income + 0.5 x dayofweek + N(0, 3). True coupon effect +0.2. sales, coupons and income rounded to 2 decimals."

  fwl_restaurant_panel.csv:
    label: "Simulated restaurants, January + June panel"
    grain: "restaurant x month (balanced panel)"
    coverage: "50 restaurants x 2 periods = 100 rows"
    key: "restaurant_id x period"
    purpose: "Input for the panel-data appendix: pooled OLS, restaurant fixed effects, two-way fixed effects and first differences, all shown to be FWL."
    note: "Simulated by simulate_restaurant_panel() in script.py with numpy default_rng(42): January rows equal fwl_store_data.csv; June adds income + N(0, 2), a summer sales lift of +3, and a persistent restaurant trait (January's sales noise) that also raises June redemption. True coupon effect +0.2 in both months."

columns:
  sales:
    label: "Monthly sales, outcome (thousands of US dollars)"
    definition: "Monthly sales of the restaurant — the outcome variable. One unit is 1,000 US dollars."
    construction: "sales = 10 + 0.2 × coupons + 0.3 × income + 0.5 × dayofweek + e, e ~ N(0, 3); computed from the unrounded draws, then rounded to 2 decimals."
    units: "thousands of US dollars"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 restaurants (100 restaurant-months in the panel)"
    kind: cont
  coupons:
    label: "Coupon redemption rate, treatment (percent)"
    definition: "Share of the restaurant's 100 coupons, handed out on one day, that were redeemed during the month, in percent — the treatment (regressor of interest). Its true effect on sales is +0.2 per percentage point."
    construction: "coupons = 60 − 0.5 × income + u, u ~ N(0, 5); rounded to 2 decimals. Wealthier neighborhoods redeem fewer coupons. In June (panel) the persistent restaurant trait is added."
    units: "percent"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 restaurants (100 restaurant-months in the panel)"
    kind: cont
  income:
    label: "Neighborhood income, confounder (thousands of US dollars)"
    definition: "Income of the restaurant's neighborhood — the confounder: it lowers the redemption rate (−0.5 per unit) and raises sales (+0.3 per unit)."
    construction: "income ~ N(50, 10); in June (panel) January income + N(0, 2); rounded to 2 decimals."
    units: "thousands of US dollars"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 restaurants (100 restaurant-months in the panel)"
    kind: cont
  dayofweek:
    label: "Day-of-week index (1-7)"
    definition: "Day-of-week index, an integer from 1 to 7. It shifts sales (+0.5 per step) but is unrelated to coupons by construction; the post adds it as a second control. No weekday names are attached to the codes."
    construction: "rng.integers(1, 8): uniform on the integers 1 to 7 (the upper bound 8 is exclusive)."
    units: "index 1–7"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 restaurants (100 restaurant-months in the panel)"
    kind: cont
  restaurant_id:
    label: "Restaurant identifier (1-50)"
    definition: "Restaurant identifier, 1 to 50, in the order the restaurants were drawn. Panel file only; row i of fwl_store_data is restaurant_id i."
    construction: "np.arange(1, n + 1)."
    units: "id"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 restaurants x 2 periods"
    kind: cont
  period:
    label: "Month of the promotion (1 = January, 2 = June)"
    definition: "Month in which the restaurant handed out its 100 coupons: 1 = January (the main-body data), 2 = June. Panel file only."
    construction: "1 for the January rows, 2 for the June rows."
    units: "code"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 restaurants x 2 periods"
    kind: cont
