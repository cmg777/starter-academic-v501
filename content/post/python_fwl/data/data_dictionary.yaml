# Data dictionary metadata for python_fwl — drives build_data_dictionary.py.
# Generated by the write-data-dictionary skill from the post's text, script.py and
# fwl_results.json (the single source of truth for every number quoted below); edit and rerun:
#   cd content/post/python_fwl/data && ../../../../.venv/bin/python build_data_dictionary.py
# Statistics on the page are computed live from fwl_store_data.csv, never written here.
# Currency: write "US dollars" in words — no dollar sign anywhere in this file (it would
# pair into math on GitHub-rendered Markdown and expand as a global macro in Stata notes).

# Raw-GitHub download links must point at the branch the site deploys from, not the
# feature branch the renderer happens to run on.
github_branch: master

study:
  title: "Simulated fast-food restaurants (FWL tutorial)"
  subtitle: "Fifty simulated fast-food restaurants, one per neighborhood, in which neighborhood income confounds the effect of the coupon redemption rate on monthly sales — the data behind every number in the Python FWL tutorial, plus the January + June panel of its appendix."
  overview: >
    Companion data for the tutorial <em>The FWL Theorem: Making Multivariate Regressions
    Intuitive</em>, inspired by Courthoud (2022). A fast-food chain runs <strong>50 simulated
    restaurants</strong>, one per neighborhood. Each restaurant hands out 100 discount coupons on a
    single day and counts how many are redeemed during the month: <code>coupons</code> is that
    redemption rate in percent, and <code>sales</code> is the restaurant's monthly sales. The data
    are built so that the answer is known in advance: a higher redemption rate raises monthly sales
    by exactly <strong>+0.2</strong> per percentage point, but neighborhood income lowers
    redemption and raises sales, so it confounds the comparison. Ignoring income, the slope of sales on coupons is &minus;0.1059
    (p = 0.365); controlling for income it becomes +0.2673 (p = 0.031), and the
    <strong>Frisch&ndash;Waugh&ndash;Lovell (FWL) theorem</strong> recovers the same +0.2673 from a
    regression of residualized sales on residualized coupons. The appendix repeats the promotion in
    June and applies FWL to the two-month panel (restaurant and two-way fixed effects, first
    differences).
  panel_structure: >
    <strong>Two files.</strong> <code>fwl_store_data</code> is the January cross-section: 50
    simulated restaurants with four numeric columns (<code>sales</code>, <code>coupons</code>,
    <code>income</code>, <code>dayofweek</code>), no missing values and no identifier (rows are in
    the order the restaurants were drawn). It is the exact input for every estimate in the main body
    of the post, the slides and the web app. <code>fwl_restaurant_panel</code> is the balanced panel
    of the appendix: the same 50 restaurants in January (<code>period</code> = 1, identical to
    <code>fwl_store_data</code>, row for row) and June (<code>period</code> = 2), 100 rows keyed by
    <code>restaurant_id</code> × <code>period</code>. Both files are written by the post's
    <code>script.py</code> (numpy <code>default_rng(42)</code>).
  kpis:
    - {n: 2, l: "datasets"}
    - {n: 6, l: "variables"}
    - {n: 50, l: "restaurants"}
    - {n: "+0.2", l: "true coupon effect"}

dta_format_version: 118

sources:
  - name: "Simulated (this study)"
    provides: "fwl_store_data — 50 simulated restaurants (January) with a known confounder (income) and a known true coupon effect (+0.2); fwl_restaurant_panel — the same restaurants in January and June"
    reference: "Mendez, C. (2026). Data-generating process in script.py (numpy default_rng(42), PCG64): https://raw.githubusercontent.com/cmg777/starter-academic-v501/master/content/post/python_fwl/script.py"
  - name: "Scenario inspiration"
    provides: "The coupons, income and sales confounding example"
    reference: "Courthoud, M. (2022). Understanding the Frisch-Waugh-Lovell Theorem. Towards Data Science (originally published as \"The FWL Theorem, Or How To Make All Regressions Intuitive\"). https://towardsdatascience.com/the-fwl-theorem-or-how-to-make-all-regressions-intuitive-59f801eb3299/"
  - name: "Method references"
    provides: "The Frisch–Waugh–Lovell theorem"
    reference: "Frisch, R., & Waugh, F. V. (1933). Econometrica, 1(4), 387–401. https://www.jstor.org/stable/1907330 — Lovell, M. C. (1963). Journal of the American Statistical Association, 58(304), 993–1010. https://doi.org/10.1080/01621459.1963.10480682"

formulas_html: |
  <h3>Data-generating process</h3>
  <p>Simulated by <code>simulate_store_data(n=50, seed=42)</code> in <code>script.py</code> with
  numpy's <code>default_rng(42)</code>; <code>N(mean, SD)</code> denotes a normal draw.</p>
  <ul class="tight">
    <li><code>income ~ N(50, 10)</code></li>
    <li><code>dayofweek ~ Uniform{1, 2, …, 7}</code> (<code>rng.integers(1, 8)</code>)</li>
    <li><code>coupons = 60 − 0.5 × income + u</code>, &nbsp;<code>u ~ N(0, 5)</code></li>
    <li><code>sales = 10 + 0.2 × coupons + 0.3 × income + 0.5 × dayofweek + e</code>,
      &nbsp;<code>e ~ N(0, 3)</code></li>
  </ul>
  <p>The true causal effect of coupons on sales is <strong>+0.2</strong> by construction: one
  percentage point of redemption (one more of the 100 coupons redeemed) adds 0.2 thousand US
  dollars (200 US dollars) of monthly sales. <code>sales</code> is computed from the unrounded
  draws; <code>sales</code>, <code>coupons</code> and <code>income</code> are then rounded to 2
  decimals.</p>

  <h3>The June round (panel appendix)</h3>
  <p><code>simulate_restaurant_panel(n=50, seed=42)</code> replays the January draws exactly and
  continues the same random stream. January's sales noise <code>α ~ N(0, 3)</code> is a persistent
  restaurant trait that raises sales in both months; in June it also raises redemption.</p>
  <ul class="tight">
    <li><code>income<sub>Jun</sub> = income<sub>Jan</sub> + N(0, 2)</code>; <code>dayofweek<sub>Jun</sub> ~ Uniform{1, …, 7}</code></li>
    <li><code>coupons<sub>Jun</sub> = 60 − 0.5 × income<sub>Jun</sub> + α + N(0, 4)</code></li>
    <li><code>sales<sub>Jun</sub> = 13 + 0.2 × coupons<sub>Jun</sub> + 0.3 × income<sub>Jun</sub> + 0.5 × dayofweek<sub>Jun</sub> + α + N(0, 1.5)</code> (a summer lift of +3)</li>
  </ul>
  <p>Pooled OLS with income and a June dummy gives 0.4496 (biased by the trait); restaurant fixed
  effects give 0.2138; two-way fixed effects and first differences both give 0.1394 (clustered SE
  0.0691), which is within sampling noise of the true 0.2.</p>

  <h3>The Frisch–Waugh–Lovell (FWL) theorem</h3>
  <p>In <code>Y = X<sub>1</sub>β<sub>1</sub> + X<sub>2</sub>β<sub>2</sub> + ε</code>, let
  <code>M<sub>2</sub> = I − X<sub>2</sub>(X<sub>2</sub>′X<sub>2</sub>)<sup>−1</sup>X<sub>2</sub>′</code>
  be the residual maker for the controls (here <code>X<sub>2</sub></code> = a constant and
  <code>income</code>; <code>M<sub>2</sub></code> is symmetric and idempotent). Then</p>
  <p><code>β̂<sub>1</sub> = (X<sub>1</sub>′M<sub>2</sub>Y) / (X<sub>1</sub>′M<sub>2</sub>X<sub>1</sub>)</code>
  — the multivariate coefficient equals the slope of a regression of residualized <code>Y</code>
  on residualized <code>X<sub>1</sub></code>.</p>
  <ul class="tight">
    <li><strong>Full regression</strong> <code>sales ~ coupons + income</code>: coupons
      <strong>0.2673</strong> (SE 0.1203, p = 0.031); income <code>γ̂ = 0.3836</code>.</li>
    <li><strong>Residualize coupons only</strong>: <code>coupons_tilde</code> = residuals of
      <code>coupons ~ income</code> (uncorrelated with income, not independent of it). Regressing raw
      <code>sales</code> on <code>coupons_tilde</code> with no intercept returns the same 0.2673, but
      its SE of 1.2715 (p = 0.834) is inflated mainly by the dropped intercept: with an intercept
      the SE is 0.1437.</li>
    <li><strong>Residualize both</strong>: <code>sales_tilde</code> = residuals of
      <code>sales ~ income</code>; <code>sales_tilde ~ coupons_tilde - 1</code> returns 0.2673 with
      SE 0.1178 = 0.1203 × √(47/49). The residuals are identical to the full model's; the full
      model spends two extra degrees of freedom (intercept + income).</li>
    <li><strong>By hand</strong>: <code>Cov(sales_tilde, coupons_tilde) / Var(coupons_tilde) =
      3.9380 / 14.7320 = 0.2673</code>.</li>
    <li><strong>Two controls</strong> (income + dayofweek partialled out together): full OLS and
      FWL both give 0.2706.</li>
  </ul>

  <h3>Omitted-variable-bias identity</h3>
  <p>Exact in the sample:
  <code>β̂<sub>naive</sub> = β̂<sub>full</sub> + γ̂ × δ̂</code>, where <code>γ̂</code> is income's coefficient in
  the full regression and <code>δ̂</code> is the slope from regressing the omitted variable
  (<code>income</code>) <em>on</em> <code>coupons</code>:</p>
  <p><code>−0.1059 = 0.2673 + 0.3836 × (−0.9730) = 0.2673 − 0.3732</code></p>
  <p>The auxiliary regression must run in this direction (<code>income ~ coupons</code>);
  regressing coupons on income instead (slope −0.3935) gives a product of −0.151 that reconciles
  nothing. In the population <code>δ = Cov(income, coupons) / Var(coupons) = −50 / 50 = −1.0</code>, so the
  naive slope converges to 0.2 + 0.3 × (−1.0) = −0.10 — confounding flips the sign of a positive
  effect.</p>

caveats:
  - "<strong>Simulated, not observed.</strong> The 50 restaurants come from a known data-generating process with a true coupon effect of +0.2 by construction. The files illustrate confounding and the FWL theorem, not a real fast-food market. <code>coupons</code> keeps two decimals, so read 36.93 as about 37 of the 100 coupons."
  - "<strong>Generated in Python with numpy's PCG64 generator</strong> (<code>np.random.default_rng(42)</code> in <code>script.py</code>). <code>sales</code>, <code>coupons</code> and <code>income</code> are rounded to 2 decimals, and every estimate in the post is computed on these rounded values."
  - "<strong>Load this file to reproduce the post in R or Stata.</strong> Native simulations with seed 42 (<code>set.seed(42)</code> in R, <code>set seed 42</code> in Stata) use different random-number generators, so they produce different draws and different estimates. Read <code>fwl_store_data.csv</code> or <code>fwl_store_data.dta</code> instead of re-simulating."
  - "<strong>Small sample.</strong> With n = 50 the controlled estimate (+0.2673, SE 0.1203) is close to, but not equal to, the true +0.2; the naive slope (−0.1059) sits near its population limit of −0.10."
  - "<strong>dayofweek is a bare 1–7 index.</strong> The simulation attaches no weekday names to the codes, and the variable enters the data-generating process linearly (slope +0.5). It is drawn independently of income and coupons (sample correlation with coupons −0.076)."
  - "<strong>No identifier in the January file.</strong> <code>fwl_store_data</code> rows are in the order the restaurants were drawn, which is the order of <code>restaurant_id</code> 1–50 in <code>fwl_restaurant_panel</code>."

