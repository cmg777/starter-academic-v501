  - name: "Method references"
    provides: "The Frisch–Waugh–Lovell theorem"
    reference: "Frisch, R., & Waugh, F. V. (1933). Econometrica, 1(4), 387–401. https://www.jstor.org/stable/1907330 — Lovell, M. C. (1963). Journal of the American Statistical Association, 58(304), 993–1010. https://doi.org/10.1080/01621459.1963.10480682"

formulas_html: |
  <h3>Data-generating process</h3>
  <p>Simulated by <code>simulate_store_data(n=50, seed=42)</code> in <code>script.py</code> with
  numpy's <code>default_rng(42)</code>; <code>N(mean, SD)</code> denotes a normal draw.</p>
  <ul class="tight">
    <li><code>income ~ N(50, 10)</code></li>
    <li><code>dayofweek ~ Uniform{1, 2, …, 7}</code> (<code>rng.integers(1, 8)</code>)</li>
    <li><code>coupons = 60 − 0.5 × income + u</code>, &nbsp;<code>u ~ N(0, 5)</code></li>
    <li><code>sales = 10 + 0.2 × coupons + 0.3 × income + 0.5 × dayofweek + e</code>,
      &nbsp;<code>e ~ N(0, 3)</code></li>
  </ul>
  <p>The true causal effect of coupons on sales is <strong>+0.2</strong> by construction: one
  percentage point of coupon usage adds 0.2 thousand US dollars (200 US dollars) of daily sales.
  <code>sales</code> is computed from the unrounded draws; <code>sales</code>, <code>coupons</code>
  and <code>income</code> are then rounded to 2 decimals.</p>

  <h3>The Frisch–Waugh–Lovell (FWL) theorem</h3>
  <p>In <code>Y = X<sub>1</sub>β<sub>1</sub> + X<sub>2</sub>β<sub>2</sub> + ε</code>, let
  <code>M<sub>2</sub> = I − X<sub>2</sub>(X<sub>2</sub>′X<sub>2</sub>)<sup>−1</sup>X<sub>2</sub>′</code>
  be the residual maker for the controls (here <code>X<sub>2</sub></code> = a constant and
  <code>income</code>; <code>M<sub>2</sub></code> is symmetric and idempotent). Then</p>
  <p><code>β̂<sub>1</sub> = (X<sub>1</sub>′M<sub>2</sub>Y) / (X<sub>1</sub>′M<sub>2</sub>X<sub>1</sub>)</code>
  — the multivariate coefficient equals the slope of a regression of residualized <code>Y</code>
  on residualized <code>X<sub>1</sub></code>.</p>
  <ul class="tight">
    <li><strong>Full regression</strong> <code>sales ~ coupons + income</code>: coupons
      <strong>0.2673</strong> (SE 0.1203, p = 0.031); income <code>γ̂ = 0.3836</code>.</li>
    <li><strong>Residualize coupons only</strong>: <code>coupons_tilde</code> = residuals of
      <code>coupons ~ income</code> (uncorrelated with income, not independent of it). Regressing raw
      <code>sales</code> on <code>coupons_tilde</code> with no intercept returns the same 0.2673, but
      its SE of 1.2715 (p = 0.834) is inflated mainly by the dropped intercept: with an intercept
      the SE is 0.1437.</li>
    <li><strong>Residualize both</strong>: <code>sales_tilde</code> = residuals of
      <code>sales ~ income</code>; <code>sales_tilde ~ coupons_tilde - 1</code> returns 0.2673 with
      SE 0.1178 = 0.1203 × √(47/49). The residuals are identical to the full model's; the full
      model spends two extra degrees of freedom (intercept + income).</li>
    <li><strong>By hand</strong>: <code>Cov(sales_tilde, coupons_tilde) / Var(coupons_tilde) =
      3.9380 / 14.7320 = 0.2673</code>.</li>
    <li><strong>Two controls</strong> (income + dayofweek partialled out together): full OLS and
      FWL both give 0.2706.</li>
  </ul>

  <h3>Omitted-variable-bias identity</h3>
  <p>Exact in the sample:
  <code>β̂<sub>naive</sub> = β̂<sub>full</sub> + γ̂ × δ̂</code>, where <code>γ̂</code> is income's coefficient in
  the full regression and <code>δ̂</code> is the slope from regressing the omitted variable
  (<code>income</code>) <em>on</em> <code>coupons</code>:</p>
  <p><code>−0.1059 = 0.2673 + 0.3836 × (−0.9730) = 0.2673 − 0.3732</code></p>
  <p>The auxiliary regression must run in this direction (<code>income ~ coupons</code>);
  regressing coupons on income instead (slope −0.3935) gives a product of −0.151 that reconciles
  nothing. In the population <code>δ = Cov(income, coupons) / Var(coupons) = −50 / 50 = −1.0</code>, so the
  naive slope converges to 0.2 + 0.3 × (−1.0) = −0.10 — confounding flips the sign of a positive
  effect.</p>

caveats:
  - "<strong>Simulated, not observed.</strong> The 50 stores come from a known data-generating process with a true coupon effect of +0.2 by construction. The file illustrates confounding and the FWL theorem, not a real retail market."
  - "<strong>Generated in Python with numpy's PCG64 generator</strong> (<code>np.random.default_rng(42)</code> in <code>script.py</code>). <code>sales</code>, <code>coupons</code> and <code>income</code> are rounded to 2 decimals, and every estimate in the post is computed on these rounded values."
  - "<strong>Load this file to reproduce the post in R or Stata.</strong> Native simulations with seed 42 (<code>set.seed(42)</code> in R, <code>set seed 42</code> in Stata) use different random-number generators, so they produce different draws and different estimates. Read <code>fwl_store_data.csv</code> or <code>fwl_store_data.dta</code> instead of re-simulating."
  - "<strong>Small sample.</strong> With n = 50 the controlled estimate (+0.2673, SE 0.1203) is close to, but not equal to, the true +0.2; the naive slope (−0.1059) sits near its population limit of −0.10."
  - "<strong>dayofweek is a bare 1–7 index.</strong> The simulation attaches no weekday names to the codes, and the variable enters the data-generating process linearly (slope +0.5). It is drawn independently of income and coupons (sample correlation with coupons −0.076)."
  - "<strong>No store identifier.</strong> Rows are in the order the stores were drawn; there is no id column."

