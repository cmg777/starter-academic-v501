files:
  fwl_store_data.csv:
    label: "Simulated retail stores: sales, coupons, income, day of week"
    grain: "store (cross-section)"
    coverage: "50 simulated stores"
    key: "row order (no store id column)"
    purpose: "Input for every estimate in the post: naive vs. full OLS, FWL residualization, the OVB identity and the two-control extension."
    note: "Simulated by script.py with numpy default_rng(42) (PCG64): income ~ N(50, 10); dayofweek uniform on 1-7; coupons = 60 - 0.5 x income + N(0, 5); sales = 10 + 0.2 x coupons + 0.3 x income + 0.5 x dayofweek + N(0, 3). True coupon effect +0.2. sales, coupons and income rounded to 2 decimals."

columns:
  sales:
    label: "Daily sales, outcome (thousands of US dollars)"
    definition: "Daily sales of the store — the outcome variable. One unit is 1,000 US dollars."
    construction: "sales = 10 + 0.2 × coupons + 0.3 × income + 0.5 × dayofweek + e, e ~ N(0, 3); computed from the unrounded draws, then rounded to 2 decimals."
    units: "thousands of US dollars"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 stores"
    kind: cont
  coupons:
    label: "Coupon usage, treatment (percent)"
    definition: "Coupon usage at the store, in percent — the treatment (regressor of interest). Its true effect on sales is +0.2 per percentage point."
    construction: "coupons = 60 − 0.5 × income + u, u ~ N(0, 5); rounded to 2 decimals. Wealthier neighborhoods use fewer coupons."
    units: "percent"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 stores"
    kind: cont
  income:
    label: "Neighborhood income, confounder (thousands of US dollars)"
    definition: "Income of the store's neighborhood — the confounder: it lowers coupon usage (−0.5 per unit) and raises sales (+0.3 per unit)."
    construction: "income ~ N(50, 10); rounded to 2 decimals."
    units: "thousands of US dollars"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 stores"
    kind: cont
  dayofweek:
    label: "Day-of-week index (1-7)"
    definition: "Day-of-week index, an integer from 1 to 7. It shifts sales (+0.5 per step) but is unrelated to coupons by construction; the post adds it as a second control. No weekday names are attached to the codes."
    construction: "rng.integers(1, 8): uniform on the integers 1 to 7 (the upper bound 8 is exclusive)."
    units: "index 1–7"
    source: "Simulation (script.py, seed 42)"
    coverage: "50 stores"
    kind: cont
