[build]
  command = "hugo --gc --minify --buildFuture -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.111.3"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.qmd"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "attachment"

# Stata do-files: render in the browser instead of downloading, so a linked
# script behaves the same way as the .py and .R ones next to it. Netlify types
# .do as application/x-stata-do, and because we also send nosniff the browser
# takes that literally and saves the file. Every .do on this site is a script
# meant to be read, so serve it as text.
[[headers]]
  for = "*.do"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "inline"

# Navigation restructure (2026-10-08): old section URLs. Per-item moves are
# covered by `aliases` (Wowchemy writes them to _redirects, which wins over these).
[[redirects]]
  from = "/projects/"
  to = "/software/"
  status = 301
  force = true

[[redirects]]
  from = "/es/projects/"
  to = "/es/software/"
  status = 301
  force = true

[[redirects]]
  from = "/ja/projects/"
  to = "/ja/software/"
  status = 301
  force = true

[[redirects]]
  from = "/post/*"
  to = "/tutorials/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/publication/*"
  to = "/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/event/*"
  to = "/presentations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/talk/*"
  to = "/presentations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/post/*"
  to = "/es/tutorials/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/publication/*"
  to = "/es/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/event/*"
  to = "/es/presentations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/talk/*"
  to = "/es/presentations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ja/post/*"
  to = "/ja/tutorials/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ja/publication/*"
  to = "/ja/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ja/event/*"
  to = "/ja/presentations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ja/talk/*"
  to = "/ja/presentations/:splat"
  status = 301
  force = true

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = false
